# silo's home holds its Podman: images, containers and the database's volume.
d /var/home/silo                 0700 silo silo -
# Lingering starts silo's user manager at boot, and with it every Quadlet.
f /var/lib/systemd/linger/silo   0644 root root -
# The control plane's directory, bound into it at the same path (docs/
# CONFIGURATION.md § Running the control plane in a container): silo.yaml,
# which Admin → Settings writes, and data/, whose folders the Bots' boxes bind.
d /var/lib/silo                  0700 silo silo -
d /var/lib/silo/data             0700 silo silo -
# Operator settings and the secrets siloos-init made (readable by silo's units).
d /etc/silo                      0750 root silo -
# siloosd's socket. Only the control plane's container has this folder.
d /run/siloosd                   0750 root silo -
# cloud-init's state (the package's folder, left out of the image).
d /var/lib/cloud                 0755 root root -
