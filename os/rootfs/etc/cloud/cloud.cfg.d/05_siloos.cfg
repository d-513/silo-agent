# SiloOS: cloud-init only where a cloud or a VM host hands it something.
# Without "None" in the list, ds-identify turns cloud-init off on a machine
# installed from the ISO or a disk, so it never makes users there.
datasource_list: [NoCloud, ConfigDrive, OpenStack, Ec2, GCE, Azure, Oracle, Hetzner, DigitalOcean, Vultr, Scaleway, VMware, LXD]

# The login a cloud's key (an EC2 key pair, a provider's SSH key) is given:
# admin. Never "silo": that user runs Silo's containers.
system_info:
  default_user:
    name: admin
    gecos: SiloOS admin
    lock_passwd: true
    groups: [wheel, adm, systemd-journal]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash

# The root grows to fill the disk by bootc-generic-growpart (the base image's,
# before anything is pulled); cloud-init's own does not understand bootc's
# /sysroot.
growpart:
  mode: "off"
resize_rootfs: false
