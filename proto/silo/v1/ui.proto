  string guide = 5;
  // SETUP.md: admin instructions; {public_url} already substituted.
  string setup = 6;
  string icon_svg = 7;
  // oauth2 | form
  string auth_kind = 8;
  // Provider name on the sign-in button ("Google").
  string auth_label = 9;
  repeated DriveVar vars = 10;
  // False while an admin still has to set required system values.
  bool available = 11;
  repeated string missing_system = 12;
}

message Drive {
  string id = 1;
  string bot_id = 2;
  string name = 3;
  string template = 4;
  bool read_only = 5;
  bool draft = 6;
  // mounting | mounted | error | stopped | needs_setup | needs_auth | needs_input | draft
  string state = 7;
  string state_detail = 8;
  // Non-secret user answers.
  map<string, string> options = 9;
  // Secret user answers that have a value (the values never leave the CP).
  repeated string secrets_set = 10;
  // Signed-in account label from the provider, when it has one.
  string account = 11;
  // An OAuth drive holds a token.
  bool connected = 12;
  // Where the Bot sees it.
  string path = 13;
  // A drive is its Workspace's, mounted in the Bots it is granted to. Seen
  // through a Bot (ListDrives), read_only, state and state_detail are that
  // Bot's mount (read-only when the drive or the grant is); seen in the
  // Workspace (ListSpaceDrives), they are the drive's own. used_by are the
  // Bots it is granted to that the caller is on, and how many others; who
  // added it and whose account it reaches (emails); whether the caller may
  // edit or delete it (who added it, or a Workspace admin).
  string space_id = 14;
  repeated string used_by = 15;
  int32 used_by_hidden = 16;
  string created_by = 17;
  string lent_by = 18;
  bool shared = 19;
  bool can_edit = 20;
}

message ListDriveTemplatesRequest {}

message ListDriveTemplatesResponse {
  repeated DriveTemplate templates = 1;
  // The exact redirect URI to register with every OAuth provider.
  string redirect_url = 2;
}

message ListDrivesRequest {
  string bot_id = 1;
  // Include the add form's draft with this id.
  string draft_id = 2;
}

message ListDrivesResponse {
  repeated Drive drives = 1;
  // False when the Bot's box predates drives (or the host refused the shared
  // mount): the UI asks for a Container reset.
  bool bind_ok = 2;
  // Why drives cannot work on this host at all, if so.
  string unavailable = 3;
}

// SaveDriveRequest creates a drive (no id: a draft in bot_id's Workspace, or
// space_id's from the hub) or changes one. The final save of a draft grants
// it to the Bot it was started from and to every Bot in bot_ids.
message SaveDriveRequest {
  string bot_id = 1;
  // Empty creates.
  string id = 2;
  string template = 3;
  string name = 4;
  bool read_only = 5;
  // Keep (or create) the row as a draft that never mounts.
  bool draft = 6;
  // User answers. Non-secret keys replace the stored set; a secret key sets
  // that secret, and a secret key left out keeps its stored value.
  map<string, string> options = 7;
  repeated string clear_secrets = 8;
  string space_id = 9;
  repeated string bot_ids = 10;
}

message ListSpaceDrivesRequest {
  string space_id = 1;
  // Include the add form's draft with this id.
  string draft_id = 2;
}

message GrantDriveRequest {
  string bot_id = 1;
  string drive_id = 2;
  // Mount it read-only in this Bot even when the drive is not.
  bool read_only = 3;
}

message RevokeDriveRequest {
  string bot_id = 1;
  string drive_id = 2;
}

message RevokeDriveResponse {}

message DeleteDriveRequest {
  string id = 1;
}

message DeleteDriveResponse {}

message BeginDriveAuthRequest {
  string id = 1;
  // As StartConnectorAuthRequest.shared.
  bool shared = 2;
}

message BeginDriveAuthResponse {
  string url = 1;
}

message PickDriveOptionsRequest {
  string id = 1;
  string key = 2;
}

message PickDriveOptionsResponse {
  repeated DriveOption options = 1;
}

message BrowseDriveRequest {
  string id = 1;
  string path = 2;
}

message BrowseDriveDir {
  string name = 1;
  string path = 2;
}

message BrowseDriveResponse {
  repeated BrowseDriveDir dirs = 1;
}

message DriveSystemField {
  string key = 1;
  string label = 2;
  string help = 3;
  string type = 4;
  bool secret = 5;
  bool required = 6;
  // Current value for non-secret fields; empty for secrets.
  string value = 7;
  bool set = 8;
  // default | yaml | env
  string source = 9;
  string env_name = 10;
}

message DriveProviderSettings {
  string template = 1;
  repeated DriveSystemField fields = 2;
  bool ready = 3;
}

message DriveSettings {
  repeated DriveProviderSettings providers = 1;
  string redirect_url = 2;
}

message GetDriveSettingsRequest {}

message PutDriveSettingsRequest {
  string template = 1;
  // Set these values; an empty value clears the key from silo.yaml.
  map<string, string> values = 2;
}
