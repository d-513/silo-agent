enum ConfigSource {
  CONFIG_SOURCE_UNSPECIFIED = 0;
  CONFIG_SOURCE_DEFAULT = 1;
  CONFIG_SOURCE_YAML = 2;
  CONFIG_SOURCE_ENV = 3;
}

message ConfigField {
  string key = 1;
  string value = 2;
  ConfigSource source = 3;
  string env_name = 4;
  bool secret = 5;
  bool restart_required = 6;
  string type = 7;
}

message Settings {
  repeated ConfigField fields = 1;
  string yaml = 2;
  string yaml_path = 3;
  repeated SearchEngine search_engines = 4;
  repeated Provider providers = 5;
  repeated ModelOption models = 6;
  string default_model = 7;
  string title_model = 8;
  repeated ConnectorVar connector_vars = 9;
  // tunnels_host is the effective tunnels.host (explicit or derived), empty
  // when tunnels have no domain; the form shows it where the field is unset.
  string tunnels_host = 10;
  AutoenableConnectors autoenable_connectors = 11;
  // oidc_redirect_url is the callback to register at the OIDC provider.
  string oidc_redirect_url = 12;
}

message Provider {
  string id = 1;
  string name = 2;
  string description = 3;
