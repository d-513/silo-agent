  string id = 1;
  string decision = 2;
}

message Rule {
  string id = 1;
  string bot_id = 2;
  string connector = 3;
  string action = 4;
  string decision = 5;
  string title = 6;
  // The output rule in effect: what happens to this action's result before
  // the Bot reads it. "pass", "flag", "check" or "withhold"; empty for an
  // action whose result is not filtered (a secret, a channel send).
  string output = 7;
  // The operator's layer for this action, when the installation has a row
  // for it: the value the owner cannot loosen while locked.
  string operator_decision = 8;
  string operator_output = 9;
  bool locked = 10;
  // The Bot's Workspace's floor for this action, when it sets one: the
  // least strict mode the Bot may use.
  string space_decision = 11;
  string space_output = 12;
  reserved 13;
}

message RuleSection {
  string id = 1;
  string title = 2;
  string summary = 3;
  repeated Rule rules = 4;
  // What the section's output rules do by default: the summary of its
  // Results side. Empty for a section with no results to filter.
  string output_summary = 5;
}

message ListRulesRequest {
  string bot_id = 1;
}

message ListRulesResponse {
  repeated Rule rules = 1;
  repeated RuleSection sections = 2;
  // The built-in output policy, used while the Bot's own is empty: shown so
  // the owner can start theirs from it.
  string default_output_policy = 3;
  // False while the operator has the output filter off: output rules are
  // kept but every result passes.
  bool filter_enabled = 4;
}

// SetRule sets the call rule, the output rule, or both. A request with an
// output and an empty decision changes the output rule only; one with no
// output leaves the output rule alone.
message SetRuleRequest {
  string bot_id = 1;
  string connector = 2;
  string action = 3;
  string decision = 4;
  optional string output = 5;
}

// OperatorRule is one row of the operator's rule layer: a connector.action
// (or connector.*) every Bot obeys. A locked row is the operator's floor: an
// owner may tighten it but not loosen it.
message OperatorRule {
  string connector = 1;
  string action = 2;
  string decision = 3;
  // The output side, empty for an action whose result is not filtered.
  string output = 4;
  bool locked = 5;
}

message ListOperatorRulesRequest {}

message ListOperatorRulesResponse {
  repeated OperatorRule rules = 1;
  // The operator's policy text: read before the Bot's own by the
  // auto-approval gate and the output filter.
  string approval_policy = 2;
  string output_policy = 3;
}

// The row is replaced as a whole: an empty decision or output clears that
// side, and both empty removes the row.
message SetOperatorRuleRequest {
  string connector = 1;
  string action = 2;
  string decision = 3;
  optional string output = 4;
  bool locked = 5;
}

message DeleteOperatorRuleRequest {
  string connector = 1;
  string action = 2;
}

message DeleteOperatorRuleResponse {}

