syntax = "proto3";

package silo.v1;

option go_package = "silo.agent/gen/silo/v1;silov1";

service UI {
  rpc SignIn(SignInRequest) returns (SignInResponse);
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  rpc Me(MeRequest) returns (MeResponse);

  rpc ListBots(ListBotsRequest) returns (ListBotsResponse);
  rpc CreateBot(CreateBotRequest) returns (Bot);
  rpc UpdateBot(UpdateBotRequest) returns (Bot);
  rpc GetBot(GetBotRequest) returns (Bot);
  rpc GetContainer(GetBotRequest) returns (Container);
  rpc StartBot(GetBotRequest) returns (Bot);
  rpc StopBot(GetBotRequest) returns (Bot);
  rpc ResetContainer(GetBotRequest) returns (Bot);
  // Every container that belongs to a Bot: its machine, drive sidecar, and
  // STDIO MCP sidecars, with usage.
  rpc ListBotContainers(GetBotRequest) returns (BotContainers);
  // Stop and remove all of them. Files, drives, and connectors stay; each
  // container is made again when it is next needed.
  rpc RemoveBotContainers(GetBotRequest) returns (Bot);
  rpc DeleteBot(GetBotRequest) returns (DeleteBotResponse);
  rpc ListMemories(ListMemoriesRequest) returns (ListMemoriesResponse);
  rpc SearchMemories(SearchMemoriesRequest) returns (SearchMemoriesResponse);
  rpc DeleteMemory(DeleteMemoryRequest) returns (DeleteMemoryResponse);
  rpc ListFeed(ListFeedRequest) returns (ListFeedResponse);
  rpc MarkFeedRead(MarkFeedReadRequest) returns (MarkFeedReadResponse);
  rpc DeleteFeedPost(DeleteFeedPostRequest) returns (DeleteFeedPostResponse);
  rpc QuoteFeedPost(QuoteFeedPostRequest) returns (QuoteFeedPostResponse);
  rpc ListAutomations(ListAutomationsRequest) returns (ListAutomationsResponse);
  rpc CreateAutomation(CreateAutomationRequest) returns (Automation);
  rpc UpdateAutomation(UpdateAutomationRequest) returns (Automation);
  rpc DeleteAutomation(DeleteAutomationRequest) returns (DeleteAutomationResponse);
  rpc RunAutomation(RunAutomationRequest) returns (RunAutomationResponse);

  rpc ListChats(ListChatsRequest) returns (ListChatsResponse);
  rpc CreateChat(CreateChatRequest) returns (Chat);
  rpc RenameChat(RenameChatRequest) returns (Chat);
  rpc DeleteChat(DeleteChatRequest) returns (DeleteChatResponse);
  rpc SetChatModel(SetChatModelRequest) returns (Chat);
  // SetChatThinking sets the chat's thinking level ("" is the model default).
  rpc SetChatThinking(SetChatThinkingRequest) returns (Chat);

  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse);

  rpc Send(SendRequest) returns (SendResponse);
  rpc StopRun(StopRunRequest) returns (StopRunResponse);
  rpc StreamRun(StreamRunRequest) returns (stream RunEvent);
  rpc EditMessage(EditMessageRequest) returns (SendResponse);
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
  rpc DivergeChat(DivergeChatRequest) returns (DivergeChatResponse);
  rpc CompactChat(CompactChatRequest) returns (CompactChatResponse);
  rpc CollectMemories(CollectMemoriesRequest) returns (CollectMemoriesResponse);
  rpc ListSubagents(ListSubagentsRequest) returns (ListSubagentsResponse);
  rpc GetSubagent(GetSubagentRequest) returns (Subagent);
  rpc StopSubagent(StopSubagentRequest) returns (StopSubagentResponse);
  rpc GetTaskboard(GetTaskboardRequest) returns (Taskboard);
  rpc ClearTaskboard(ClearTaskboardRequest) returns (Taskboard);

  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc AddSecret(AddSecretRequest) returns (SecretMeta);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);

  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  rpc DecideApproval(DecideApprovalRequest) returns (Approval);

  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc SetRule(SetRuleRequest) returns (Rule);

  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc Mkdir(MkdirRequest) returns (FileOpResponse);
  rpc RemoveFile(RemoveFileRequest) returns (FileOpResponse);
  rpc PutFile(PutFileRequest) returns (FileOpResponse);

  rpc GetSettings(GetSettingsRequest) returns (Settings);
  rpc PutSettings(PutSettingsRequest) returns (Settings);
  rpc SetModels(SetModelsRequest) returns (Settings);
  rpc SetConnectorVars(SetConnectorVarsRequest) returns (Settings);

  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse);

  rpc ListLLMLogs(ListLLMLogsRequest) returns (ListLLMLogsResponse);

  rpc ListConnectors(ListConnectorsRequest) returns (ListConnectorsResponse);
  rpc CreateConnector(CreateConnectorRequest) returns (Connector);
  rpc UpdateConnector(UpdateConnectorRequest) returns (Connector);
  rpc DeleteConnector(DeleteConnectorRequest) returns (DeleteConnectorResponse);

  rpc ListBotConnectors(ListBotConnectorsRequest) returns (ListBotConnectorsResponse);
  rpc AttachConnector(AttachConnectorRequest) returns (BotConnector);
  rpc CreateBotConnector(CreateBotConnectorRequest) returns (BotConnector);
  rpc DetachConnector(DetachConnectorRequest) returns (DetachConnectorResponse);
  rpc RefreshBotConnector(RefreshBotConnectorRequest) returns (BotConnector);
  rpc StartConnectorAuth(StartConnectorAuthRequest) returns (StartConnectorAuthResponse);

  rpc SeedConnectors(SeedConnectorsRequest) returns (SeedConnectorsResponse);
  rpc SeedSkills(SeedSkillsRequest) returns (SeedSkillsResponse);
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc InstallSkill(InstallSkillRequest) returns (InstallSkillResponse);
  rpc DeleteSkill(DeleteSkillRequest) returns (DeleteSkillResponse);
  rpc ListBotSkills(ListBotSkillsRequest) returns (ListBotSkillsResponse);
  rpc SetBotSkill(SetBotSkillRequest) returns (BotSkill);
  rpc ListSkillFiles(ListSkillFilesRequest) returns (ListFilesResponse);
  rpc ReadSkillFile(ReadSkillFileRequest) returns (ReadFileResponse);
  rpc SaveSkill(SaveSkillRequest) returns (SaveSkillResponse);

  rpc ListChannelAdapters(ListChannelAdaptersRequest) returns (ListChannelAdaptersResponse);
  rpc ListBotChannels(ListBotChannelsRequest) returns (ListBotChannelsResponse);
  rpc CreateChannel(CreateChannelRequest) returns (Channel);
  rpc UpdateChannel(UpdateChannelRequest) returns (Channel);
  rpc DeleteChannel(DeleteChannelRequest) returns (DeleteChannelResponse);
  rpc ChannelAction(ChannelActionRequest) returns (ChannelActionResponse);

  // Drives: rclone remotes mounted at /workspace/drives/<name>.
  rpc ListDriveTemplates(ListDriveTemplatesRequest) returns (ListDriveTemplatesResponse);
  rpc ListDrives(ListDrivesRequest) returns (ListDrivesResponse);
  rpc SaveDrive(SaveDriveRequest) returns (Drive);
  rpc DeleteDrive(DeleteDriveRequest) returns (DeleteDriveResponse);
  rpc BeginDriveAuth(BeginDriveAuthRequest) returns (BeginDriveAuthResponse);
  rpc PickDriveOptions(PickDriveOptionsRequest) returns (PickDriveOptionsResponse);
  rpc BrowseDrive(BrowseDriveRequest) returns (BrowseDriveResponse);
  // Admin: per-template system values (OAuth client ids and secrets).
  rpc GetDriveSettings(GetDriveSettingsRequest) returns (DriveSettings);
  rpc PutDriveSettings(PutDriveSettingsRequest) returns (DriveSettings);
}

message SignInRequest {
  string email = 1;
  string password = 2;
}

message SignInResponse {
  User user = 1;
  bool created = 2;
}

message SignOutRequest {}

message SignOutResponse {}

message MeRequest {}

message MeResponse {
  User user = 1;
}

message User {
  string id = 1;
  string email = 2;
  bool admin = 3;
}

message Bot {
  string id = 1;
  string name = 2;
  string status = 3;
  string last_task = 4;
  int32 crest = 5;
  bool worker_connected = 6;
  string description = 7;
  string soul = 8;
  string memory = 9;
  // AutoApprove is this Bot's free-text auto-approval policy. Rules set to
  // "auto" consult the approval model with this text.
  string auto_approve = 10;
  // Model is this Bot's default provider/model. Empty falls back to the
  // operator default; a chat override still wins for its conversation.
  string model = 11;
  // FeedUnread counts Feed posts the owner has not seen yet.
  int32 feed_unread = 12;
}

message ListBotsRequest {}

message ListBotsResponse {
  repeated Bot bots = 1;
}

message CreateBotRequest {
  string name = 1;
  int32 crest = 2;
  string description = 3;
}

message UpdateBotRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string soul = 4;
  string memory = 5;
  string auto_approve = 6;
  string model = 7;
}

message GetBotRequest {
  string id = 1;
}

message Container {
  bool running = 1;
  double cpu_percent = 2;
  int64 mem_used = 3;
  int64 mem_limit = 4;
}

// BotContainer is one container a Bot owns.
message BotContainer {
  // bot | drive | mcp
  string kind = 1;
  // Engine container name (silo-…).
  string name = 2;
  // What it is for a human: "Machine", "Drives", or the connector's name.
  string label = 3;
  // running | stopped | absent (not created yet, or removed)
  string state = 4;
  string image = 5;
  // RFC 3339; empty unless running.
  string started_at = 6;
  double cpu_percent = 7;
  int64 mem_used = 8;
  int64 mem_limit = 9;
  // One line of context: "3 drives", "stdio · npx @modelcontextprotocol/…".
  string detail = 10;
}

message BotContainers {
  repeated BotContainer containers = 1;
}

message DeleteBotResponse {}

// Memory is one long-term (pgvector) memory a Bot saved with `remember`.
message Memory {
  string id = 1;
  string content = 2;
  string created_at = 3;
  // Empty until recall (or auto-recall) returns it.
  string last_used_at = 4;
  // Cosine distance to the query; set only by SearchMemories.
  double distance = 5;
  // "fact" or "lesson" (a pitfall and what worked).
  string kind = 6;
  // Set when the memory collector saved it from this chat.
  string chat_id = 7;
}

message ListMemoriesRequest {
  string bot_id = 1;
}

message ListMemoriesResponse {
  repeated Memory memories = 1;
}

// SearchMemories ranks the Bot's memories by meaning (pgvector). It does not
// count as a recall, so last_used_at is left alone.
message SearchMemoriesRequest {
  string bot_id = 1;
  string query = 2;
  // Default 20, max 50.
  int32 limit = 3;
}

message SearchMemoriesResponse {
  repeated Memory memories = 1;
}

message DeleteMemoryRequest {
  string bot_id = 1;
  string id = 2;
}

message DeleteMemoryResponse {}

// FeedPost is one read-only message a Bot posted to its Feed with `feed`.
message FeedPost {
  string id = 1;
  string body = 2; // markdown
  string title = 3;
  // Source names where it was posted from: "chat", "automation", or "channel".
  string source_kind = 4;
  // SourceName is the chat title, automation name, or channel name.
  string source_name = 5;
  string chat_id = 6;
  string created_at = 7;
  bool read = 8;
}

message ListFeedRequest {
  string bot_id = 1;
}

message ListFeedResponse {
  repeated FeedPost posts = 1;
}

// MarkFeedRead marks every post up to now as read.
message MarkFeedReadRequest {
  string bot_id = 1;
}

message MarkFeedReadResponse {}

message DeleteFeedPostRequest {
  string bot_id = 1;
  string id = 2;
}

message DeleteFeedPostResponse {}

// QuoteFeedPost starts a new chat whose context is the quoted post.
message QuoteFeedPostRequest {
  string bot_id = 1;
  string id = 2;
}

message QuoteFeedPostResponse {
  Chat chat = 1;
}

// Automation is a scheduled background prompt. Each one owns a hidden Chat
// (chat_id) whose runs are its log; every firing starts with a fresh context.
message Automation {
  string id = 1;
  string bot_id = 2;
  string name = 3;
  string prompt = 4;
  // Standard 5-field cron in the Control Plane's local time. Empty never
  // fires on its own (Run now still works).
  string schedule = 5;
  bool enabled = 6;
  // "heartbeat" (pinned, one per Bot, cannot be deleted) or "custom".
  string kind = 7;
  string chat_id = 8;
  // RFC 3339; empty when it never ran / will not run.
  string last_run_at = 9;
  string next_run_at = 10;
  // done | error | stopped | interrupted | skipped, from the last firing.
  string last_status = 11;
  // A run of this automation is live now.
  bool running = 12;
  // "user" or "bot".
  string created_by = 13;
  string created_at = 14;
}

message ListAutomationsRequest {
  string bot_id = 1;
}

message ListAutomationsResponse {
  repeated Automation automations = 1;
}

message CreateAutomationRequest {
  string bot_id = 1;
  string name = 2;
  string prompt = 3;
  string schedule = 4;
  bool enabled = 5;
}

message UpdateAutomationRequest {
  string bot_id = 1;
  string id = 2;
  string name = 3;
  string prompt = 4;
  string schedule = 5;
  bool enabled = 6;
}

message DeleteAutomationRequest {
  string bot_id = 1;
  string id = 2;
}

message DeleteAutomationResponse {}

message RunAutomationRequest {
  string bot_id = 1;
  string id = 2;
}

message RunAutomationResponse {
  string run_id = 1;
  string chat_id = 2;
}

message Chat {
  string id = 1;
  string bot_id = 2;
  string title = 3;
  string updated_at = 4;
  string model = 5;
  // thinking is the chosen thinking level; "" is the model's default. It is
  // fitted to each model's levels when a turn runs.
  string thinking = 6;
}

message ModelOption {
  string id = 1;
  string provider = 2;
  string label = 3;
  // thinking_levels are the levels this model accepts, least reasoning
  // first (off, minimal, low, medium, high, xhigh, max). Empty means the
  // model has no selectable thinking.
  repeated string thinking_levels = 4;
}

message ListModelsRequest {
  string bot_id = 1;
}

message ListModelsResponse {
  repeated ModelOption models = 1;
  string default_model = 2;
  string title_model = 3;
  // voice_enabled is true when transcribe_model is set and its provider is
  // configured, so the composer can offer dictation.
  bool voice_enabled = 4;
}

// TranscribeRequest carries one dictated recording (browser MediaRecorder
// bytes). language is an optional ISO-639-1 hint.
message TranscribeRequest {
  string bot_id = 1;
  bytes audio = 2;
  string mime = 3;
  string language = 4;
}

message TranscribeResponse {
  string text = 1;
}

message SetChatModelRequest {
  string bot_id = 1;
  string chat_id = 2;
  string model = 3;
}

message SetChatThinkingRequest {
  string bot_id = 1;
  string chat_id = 2;
  string thinking = 3;
}

message ListChatsRequest {
  string bot_id = 1;
  // Empty lists Web UI chats only. Set to a channel id to list that channel's
  // conversations.
  string channel_id = 2;
}

message ListChatsResponse {
  repeated Chat chats = 1;
}

message CreateChatRequest {
  string bot_id = 1;
}

message RenameChatRequest {
  string bot_id = 1;
  string id = 2;
  string title = 3;
}

message DeleteChatRequest {
  string bot_id = 1;
  string id = 2;
}

message DeleteChatResponse {}

message Attachment {
  string name = 1;
  string path = 2;
  int64 size = 3;
  string mime = 4;
}

message SendRequest {
  string bot_id = 1;
  string text = 2;
  string chat_id = 3;
  repeated Attachment attachments = 4;
}

message SendResponse {
  string run_id = 1;
  string chat_id = 2;
}

message StopRunRequest {
  string bot_id = 1;
  string chat_id = 2;
}

message StopRunResponse {}

message StreamRunRequest {
  string bot_id = 1;
  string chat_id = 2;
  string after_event_id = 3;
}

message RunEvent {
  string run_id = 1;
  string kind = 2;
  string body = 3;
  string tool = 4;
  string chat_id = 5;
  string id = 6;
  repeated Attachment attachments = 7;
  // RFC 3339 time the event was recorded. Set on user events (live and
  // replayed) and on every replayed event.
  string created_at = 8;
}

// EditMessage truncates this chat at the last user message and re-sends the
// edited text as a fresh turn. Only the trailing user message can be edited;
// earlier points use DivergeChat.
message EditMessageRequest {
  string bot_id = 1;
  string chat_id = 2;
  string event_id = 3;
  string text = 4;
  repeated Attachment attachments = 5;
}

// DeleteMessage truncates this chat at the last user message and stops there.
message DeleteMessageRequest {
  string bot_id = 1;
  string chat_id = 2;
  string event_id = 3;
}

message DeleteMessageResponse {}

// DivergeChat copies the context before a message into a new chat.
message DivergeChatRequest {
  string bot_id = 1;
  string chat_id = 2;
  string event_id = 3;
}

message DivergeChatResponse {
  Chat chat = 1;
}

// CompactChat summarizes a web chat's history into one compaction event so
// later runs replay the summary instead of every turn. Refused while a reply
// is running.
message CompactChatRequest {
  string bot_id = 1;
  string chat_id = 2;
}

message CompactChatResponse {
  string run_id = 1;
}

// CollectMemories runs the memory collector over a chat's messages since its
// last collection: one cheap model call that saves missed facts and lessons.
message CollectMemoriesRequest {
  string bot_id = 1;
  string chat_id = 2;
}

message CollectMemoriesResponse {
  int32 saved = 1;
  int32 updated = 2;
  int32 forgotten = 3;
  // The memories saved or updated by this collection.
  repeated Memory memories = 4;
  // Why nothing was read (for example "nothing new"); empty after a read.
  string note = 5;
}

// Subagent is a background agent loop a chat's lead started. Its work log is
// the hidden chat chat_id; parent_chat_id is the lead's chat.
message Subagent {
  string id = 1;
  string bot_id = 2;
  string parent_chat_id = 3;
  string chat_id = 4;
  string name = 5;
  string goal = 6;
  string context = 7;
  string model = 8;
  // running | done | error | stopped | interrupted
  string status = 9;
  bool running = 10;
  // The subagent's final reply from its latest run.
  string result = 11;
  string created_at = 12;
  string finished_at = 13;
  // Latest one-line activity (a tool name or the start of a reply).
  string activity = 14;
  // Its latest run, so approvals it is waiting on can be matched.
  string run_id = 15;
}

message ListSubagentsRequest {
  string bot_id = 1;
  // The lead chat.
  string chat_id = 2;
}

message ListSubagentsResponse {
  repeated Subagent subagents = 1;
}

message GetSubagentRequest {
  string bot_id = 1;
  string id = 2;
}

message StopSubagentRequest {
  string bot_id = 1;
  string id = 2;
}

message StopSubagentResponse {}

message TaskItem {
  int32 n = 1;
  string text = 2;
  // The [NAME] a task is tagged with; empty is the lead's or anyone's.
  string assignee = 3;
  bool done = 4;
  string done_by = 5;
  string note = 6;
  string created_by = 7;
}

message Taskboard {
  // The lead chat the board belongs to.
  string chat_id = 1;
  repeated TaskItem items = 2;
}

message GetTaskboardRequest {
  string bot_id = 1;
  // A lead chat or one of its subagents' chats.
  string chat_id = 2;
}

message ClearTaskboardRequest {
  string bot_id = 1;
  string chat_id = 2;
}

message SecretMeta {
  string id = 1;
  string name = 2;
  string created_at = 3;
  string last_used_at = 4;
}

message ListSecretsRequest {
  string bot_id = 1;
}

message ListSecretsResponse {
  repeated SecretMeta secrets = 1;
}

message AddSecretRequest {
  string bot_id = 1;
  string name = 2;
  string value = 3;
}

message DeleteSecretRequest {
  string bot_id = 1;
  string id = 2;
}

message DeleteSecretResponse {}

message ApprovalField {
  string label = 1;
  string value = 2;
}

message Approval {
  string id = 1;
  string bot_id = 2;
  string run_id = 3;
  string connector = 4;
  string action = 5;
  string args_json = 6;
  string status = 7;
  string title = 8;
  string summary = 9;
  repeated ApprovalField fields = 10;
  // Who asked: "Chat · <title>", "Automation · <name>", "Channel · <name>",
  // "Subagent · <name>", or "Background process" for an orphan call (no live
  // run; see callRun).
  string source = 11;
}

message ListApprovalsRequest {
  string bot_id = 1;
}

message ListApprovalsResponse {
  repeated Approval approvals = 1;
}

message DecideApprovalRequest {
  string id = 1;
  string decision = 2;
}

message Rule {
  string id = 1;
  string bot_id = 2;
  string connector = 3;
  string action = 4;
  string decision = 5;
  string title = 6;
}

message RuleSection {
  string id = 1;
  string title = 2;
  string summary = 3;
  repeated Rule rules = 4;
}

message ListRulesRequest {
  string bot_id = 1;
}

message ListRulesResponse {
  repeated Rule rules = 1;
  repeated RuleSection sections = 2;
}

message SetRuleRequest {
  string bot_id = 1;
  string connector = 2;
  string action = 3;
  string decision = 4;
}

message FileEntry {
  string name = 1;
  string path = 2;
  bool dir = 3;
  int64 size = 4;
  string modified = 5;
}

message ListFilesRequest {
  string bot_id = 1;
  string path = 2;
}

message ListFilesResponse {
  repeated FileEntry entries = 1;
}

message ReadFileRequest {
  string bot_id = 1;
  string path = 2;
}

message ReadFileResponse {
  string name = 1;
  string content = 2;
  bool binary = 3;
  bool truncated = 4;
  int64 size = 5;
  bytes data = 6;
}

message MkdirRequest {
  string bot_id = 1;
  string path = 2;
}

message RemoveFileRequest {
  string bot_id = 1;
  string path = 2;
}

message PutFileRequest {
  string bot_id = 1;
  string path = 2;
  bytes data = 3;
}

message FileOpResponse {}

enum ConfigSource {
  CONFIG_SOURCE_UNSPECIFIED = 0;
  CONFIG_SOURCE_DEFAULT = 1;
  CONFIG_SOURCE_YAML = 2;
  CONFIG_SOURCE_ENV = 3;
}

message ConfigField {
  string key = 1;
  string value = 2;
  ConfigSource source = 3;
  string env_name = 4;
  bool secret = 5;
  bool restart_required = 6;
  string type = 7;
}

message Settings {
  repeated ConfigField fields = 1;
  string yaml = 2;
  string yaml_path = 3;
  repeated SearchEngine search_engines = 4;
  repeated Provider providers = 5;
  repeated ModelOption models = 6;
  string default_model = 7;
  string title_model = 8;
  repeated ConnectorVar connector_vars = 9;
}

message Provider {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated ProviderField fields = 4;
  bool supports_cache = 5;
  repeated string cache_ttls = 6;
}

message ProviderField {
  string key = 1;
  string label = 2;
  string type = 3;
  string description = 4;
  bool secret = 5;
}

message SetModelsRequest {
  repeated string models = 1;
}

// ConnectorVar is one operator-defined connector variable. These are plain
// values, not secrets, and are shown in full when the caller is an admin.
message ConnectorVar {
  string name = 1;
  string value = 2;
  ConfigSource source = 3;
  string env_name = 4;
}

message SetConnectorVarsRequest {
  repeated ConnectorVar connector_vars = 1;
}

message SearchEngine {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated SearchEngineField fields = 4;
}

message SearchEngineField {
  string key = 1;
  string label = 2;
  string type = 3;
  string description = 4;
  bool secret = 5;
  bool has_value = 6;
}

message GetSettingsRequest {}

message PutSettingsRequest {
  map<string, string> fields = 1;
  string yaml = 2;
}

message AuditRow {
  string id = 1;
  string at = 2;
  string bot_id = 3;
  string bot_name = 4;
  int32 crest = 5;
  string actor = 6;
  string action = 7;
  string decision = 8;
}

message ListAuditRequest {}

message ListAuditResponse {
  repeated AuditRow rows = 1;
}

message LLMLog {
  string id = 1;
  string at = 2;
  string bot_id = 3;
  // Label is the calling feature: chat, title, or approval.
  string label = 4;
  string provider = 5;
  string model = 6;
  string request = 7;
  string response = 8;
  string error = 9;
  int32 input_tokens = 10;
  int32 output_tokens = 11;
  int64 duration_ms = 12;
}

message ListLLMLogsRequest {
  // Empty lists every Bot's logs.
  string bot_id = 1;
}

message ListLLMLogsResponse {
  repeated LLMLog logs = 1;
  // Enabled mirrors the operator's debug flag.
  bool enabled = 2;
}

message HeaderKey {
  string name = 1;
}

message EnvKey {
  string name = 1;
  bool secret = 2;
  string secret_name = 3;
}

message EnvInput {
  string name = 1;
  string value = 2;
  string secret = 3;
}

message Connector {
  string id = 1;
  string type = 2;
  string name = 3;
  string description = 4;
  bool has_image = 5;
  string transport = 6;
  string http_url = 7;
  string auth = 8;
  repeated HeaderKey header_keys = 9;
  string created_at = 10;
  string default_mode = 11;
  string kind = 12;
  string source_id = 13;
  string oauth_client_id = 14;
  bool has_oauth_client_secret = 15;
  string catalog_guide = 16;
  string stdio_command = 17;
  repeated string stdio_args = 18;
  string stdio_image = 19;
  repeated EnvKey env_keys = 20;
  string prompt = 21;
  bool auto_attach = 22;
  string category = 23;
  // The `tools.<slug>` name; a chat `call` event's tool is `<slug>.<action>`.
  string slug = 24;
  // Built-in connectors (transport "builtin") run Go code on the CP. builtin
  // names the registry entry; fields are its declared config inputs. config
  // holds the non-secret values; secret values never leave the CP, only
  // secrets_set lists which are filled.
  string builtin = 25;
  repeated ChannelField fields = 26;
  map<string, string> config = 27;
  repeated string secrets_set = 28;
}

