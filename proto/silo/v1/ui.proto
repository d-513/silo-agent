// Quote is a piece of the conversation or of a file the human points at in a
// message. source is message (a reply or the human's own words), file (a
// workspace file) or artifact (a version of an artifact card). ref names what
// was quoted: an event id, a workspace path, or artifact_id@version. locator is
// where in it: "L40-52" for lines, "x,y,w,h" (fractions of the image) for an
// image region. image is the workspace path of the cropped region, if any.
message Quote {
  string source = 1;
  string ref = 2;
  string label = 3;
  string text = 4;
  string locator = 5;
  string image = 6;
}

message SendRequest {
  string bot_id = 1;
  string text = 2;
  string chat_id = 3;
  repeated Attachment attachments = 4;
  // The sending device's IANA zone. An unpinned Bot follows it.
  string time_zone = 5;
  // With no chat_id: make a new chat for this message instead of using the
  // newest one. model and thinking are what it starts with ("" = default).
  bool new_chat = 6;
  string model = 7;
  string thinking = 8;
  repeated Quote quotes = 9;
  // confirmed re-sends a slash command that answered with confirm.
  bool confirmed = 10;
}

message SendResponse {
  string run_id = 1;
  string chat_id = 2;
  // A text that was a slash command ran it instead of starting a run: the
  // command's name, what it says back, and (for one that destroys something)
  // the question to ask before sending again with confirmed.
  string command = 3;
  string notice = 4;
  string confirm = 5;
  // new_chat: the command asks the client to open an empty new chat.
  bool new_chat = 6;
  // value is the command's result for a client that words it itself: the
  // model or thinking level now set, the new title, how many messages a wipe
  // takes, "empty" for a /clear with nothing to clear, "idle" for a /stop
  // with nothing running, "saved/updated/forgotten" for /remember.
  string value = 7;
}

message Command {
  string name = 1;
  // How its argument reads in the menu ("[model]"), empty for none.
  string args = 2;
  string summary = 3;
  // It asks before it acts.
  bool confirm = 4;
  // It also works from a channel conversation.
  bool channel = 5;
}

message ListCommandsRequest {
  string bot_id = 1;
}

message ListCommandsResponse {
  repeated Command commands = 1;
}

message ListChatEventsRequest {
  string bot_id = 1;
  string chat_id = 2;
