  // fitted to each model's levels when a turn runs.
  string thinking = 6;
  // A main chat: pinned, never deleted or renamed. Each person on a Bot has
  // their own.
  bool main = 7;
  // author is who writes in it (email); empty is the Bot's own (a mail wake,
  // a channel). mine: the caller is its author; anyone else reads it only.
  string author = 8;
  bool mine = 9;
}

message ModelOption {
  string id = 1;
  string provider = 2;
  string label = 3;
  // thinking_levels are the levels this model accepts, least reasoning
  // first (off, minimal, low, medium, high, xhigh, max). Empty means the
  // model has no selectable thinking.
  repeated string thinking_levels = 4;
  // kind is "text" (a model that writes: chats and the text roles) or
  // "decision" (a model that answers typed questions with probabilities).
  string kind = 5;
}

