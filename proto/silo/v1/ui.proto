message CollectMemoriesResponse {
  int32 saved = 1;
  int32 updated = 2;
  int32 forgotten = 3;
  // The memories saved or updated by this collection.
  repeated Memory memories = 4;
  // Why nothing was read (for example "nothing new"); empty after a read.
  string note = 5;
}

// Subagent is a background agent loop a chat's lead started. Its work log is
// the hidden chat chat_id; parent_chat_id is the lead's chat.
message Subagent {
  string id = 1;
  string bot_id = 2;
  string parent_chat_id = 3;
  string chat_id = 4;
  string name = 5;
  string goal = 6;
  string context = 7;
  string model = 8;
  // running | done | error | stopped | interrupted
  string status = 9;
  bool running = 10;
  // The subagent's final reply from its latest run.
  string result = 11;
  string created_at = 12;
  string finished_at = 13;
  // Latest one-line activity (a tool name or the start of a reply).
  string activity = 14;
  // Its latest run, so approvals it is waiting on can be matched.
  string run_id = 15;
}

message ListSubagentsRequest {
  string bot_id = 1;
  // The lead chat.
  string chat_id = 2;
}

message ListSubagentsResponse {
  repeated Subagent subagents = 1;
