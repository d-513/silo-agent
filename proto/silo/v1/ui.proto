syntax = "proto3";

package silo.v1;

option go_package = "silo.agent/gen/silo/v1;silov1";

service UI {
  rpc SignIn(SignInRequest) returns (SignInResponse);
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  rpc Me(MeRequest) returns (MeResponse);

  rpc ListBots(ListBotsRequest) returns (ListBotsResponse);
  rpc CreateBot(CreateBotRequest) returns (Bot);
  rpc UpdateBot(UpdateBotRequest) returns (Bot);
  rpc GetBot(GetBotRequest) returns (Bot);
  rpc GetContainer(GetBotRequest) returns (Container);
  rpc StartBot(GetBotRequest) returns (Bot);
  rpc StopBot(GetBotRequest) returns (Bot);
  rpc ResetContainer(GetBotRequest) returns (Bot);
  rpc DeleteBot(GetBotRequest) returns (DeleteBotResponse);

  rpc ListChats(ListChatsRequest) returns (ListChatsResponse);
  rpc CreateChat(CreateChatRequest) returns (Chat);
  rpc RenameChat(RenameChatRequest) returns (Chat);
  rpc DeleteChat(DeleteChatRequest) returns (DeleteChatResponse);

  rpc Send(SendRequest) returns (SendResponse);
  rpc StopRun(StopRunRequest) returns (StopRunResponse);
  rpc StreamRun(StreamRunRequest) returns (stream RunEvent);

  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc AddSecret(AddSecretRequest) returns (SecretMeta);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);

  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  rpc DecideApproval(DecideApprovalRequest) returns (Approval);

  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc SetRule(SetRuleRequest) returns (Rule);

  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc Mkdir(MkdirRequest) returns (FileOpResponse);
  rpc RemoveFile(RemoveFileRequest) returns (FileOpResponse);
  rpc PutFile(PutFileRequest) returns (FileOpResponse);

  rpc GetSettings(GetSettingsRequest) returns (Settings);
  rpc PutSettings(PutSettingsRequest) returns (Settings);

  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse);

  rpc ListConnectors(ListConnectorsRequest) returns (ListConnectorsResponse);
  rpc CreateConnector(CreateConnectorRequest) returns (Connector);
  rpc UpdateConnector(UpdateConnectorRequest) returns (Connector);
  rpc DeleteConnector(DeleteConnectorRequest) returns (DeleteConnectorResponse);

  rpc ListBotConnectors(ListBotConnectorsRequest) returns (ListBotConnectorsResponse);
  rpc AttachConnector(AttachConnectorRequest) returns (BotConnector);
  rpc CreateBotConnector(CreateBotConnectorRequest) returns (BotConnector);
  rpc DetachConnector(DetachConnectorRequest) returns (DetachConnectorResponse);
  rpc RefreshBotConnector(RefreshBotConnectorRequest) returns (BotConnector);
  rpc StartConnectorAuth(StartConnectorAuthRequest) returns (StartConnectorAuthResponse);
}

message SignInRequest {
  string email = 1;
  string password = 2;
}

message SignInResponse {
  User user = 1;
  bool created = 2;
}

message SignOutRequest {}

message SignOutResponse {}

message MeRequest {}

message MeResponse {
  User user = 1;
}

message User {
  string id = 1;
  string email = 2;
  bool admin = 3;
}

message Bot {
  string id = 1;
  string name = 2;
  string status = 3;
  string last_task = 4;
  int32 crest = 5;
  bool worker_connected = 6;
  string description = 7;
  string soul = 8;
  string memory = 9;
}

message ListBotsRequest {}

message ListBotsResponse {
  repeated Bot bots = 1;
}

message CreateBotRequest {
  string name = 1;
  int32 crest = 2;
  string description = 3;
}

message UpdateBotRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string soul = 4;
  string memory = 5;
}

message GetBotRequest {
  string id = 1;
}

message Container {
  bool running = 1;
  double cpu_percent = 2;
  int64 mem_used = 3;
  int64 mem_limit = 4;
}

message DeleteBotResponse {}

message Chat {
  string id = 1;
  string bot_id = 2;
  string title = 3;
  string updated_at = 4;
}

message ListChatsRequest {
  string bot_id = 1;
}

message ListChatsResponse {
  repeated Chat chats = 1;
}

message CreateChatRequest {
  string bot_id = 1;
}

message RenameChatRequest {
  string bot_id = 1;
  string id = 2;
  string title = 3;
}

message DeleteChatRequest {
  string bot_id = 1;
  string id = 2;
}

message DeleteChatResponse {}

message SendRequest {
  string bot_id = 1;
  string text = 2;
  string chat_id = 3;
}

message SendResponse {
  string run_id = 1;
  string chat_id = 2;
}

message StopRunRequest {
  string bot_id = 1;
  string chat_id = 2;
}

message StopRunResponse {}

message StreamRunRequest {
  string bot_id = 1;
  string chat_id = 2;
  string after_event_id = 3;
}

message RunEvent {
  string run_id = 1;
  string kind = 2;
  string body = 3;
  string tool = 4;
  string chat_id = 5;
  string id = 6;
}

message SecretMeta {
  string id = 1;
  string name = 2;
  string created_at = 3;
  string last_used_at = 4;
}

message ListSecretsRequest {
  string bot_id = 1;
}

message ListSecretsResponse {
  repeated SecretMeta secrets = 1;
}

message AddSecretRequest {
  string bot_id = 1;
  string name = 2;
  string value = 3;
}

message DeleteSecretRequest {
  string bot_id = 1;
  string id = 2;
}

message DeleteSecretResponse {}

message ApprovalField {
  string label = 1;
  string value = 2;
}

message Approval {
  string id = 1;
  string bot_id = 2;
  string run_id = 3;
  string connector = 4;
  string action = 5;
  string args_json = 6;
  string status = 7;
  string title = 8;
  string summary = 9;
  repeated ApprovalField fields = 10;
}

message ListApprovalsRequest {
  string bot_id = 1;
}

message ListApprovalsResponse {
  repeated Approval approvals = 1;
}

message DecideApprovalRequest {
  string id = 1;
  string decision = 2;
}

message Rule {
  string id = 1;
  string bot_id = 2;
  string connector = 3;
  string action = 4;
  string decision = 5;
  string title = 6;
}

message RuleSection {
  string id = 1;
  string title = 2;
  string summary = 3;
  repeated Rule rules = 4;
}

message ListRulesRequest {
  string bot_id = 1;
}

message ListRulesResponse {
  repeated Rule rules = 1;
  repeated RuleSection sections = 2;
}

message SetRuleRequest {
  string bot_id = 1;
  string connector = 2;
  string action = 3;
  string decision = 4;
}

message FileEntry {
  string name = 1;
  string path = 2;
  bool dir = 3;
  int64 size = 4;
  string modified = 5;
}

message ListFilesRequest {
  string bot_id = 1;
  string path = 2;
}

message ListFilesResponse {
  repeated FileEntry entries = 1;
}

message ReadFileRequest {
  string bot_id = 1;
  string path = 2;
}

message ReadFileResponse {
  string name = 1;
  string content = 2;
  bool binary = 3;
  bool truncated = 4;
  int64 size = 5;
  bytes data = 6;
}

message MkdirRequest {
  string bot_id = 1;
  string path = 2;
}

message RemoveFileRequest {
  string bot_id = 1;
  string path = 2;
}

message PutFileRequest {
  string bot_id = 1;
  string path = 2;
  bytes data = 3;
}

message FileOpResponse {}

message Settings {
  string model = 1;
  bool has_api_key = 2;
  string api_key = 3;
}

message GetSettingsRequest {}

message PutSettingsRequest {
  string model = 1;
  string api_key = 2;
}

message AuditRow {
  string id = 1;
  string at = 2;
  string bot_id = 3;
  string bot_name = 4;
  int32 crest = 5;
  string actor = 6;
  string action = 7;
  string decision = 8;
}

message ListAuditRequest {}

message ListAuditResponse {
  repeated AuditRow rows = 1;
}

message HeaderKey {
  string name = 1;
}

message Connector {
  string id = 1;
  string type = 2;
  string name = 3;
  string description = 4;
  bool has_image = 5;
  string transport = 6;
  string http_url = 7;
  string auth = 8;
  repeated HeaderKey header_keys = 9;
  string created_at = 10;
  string default_mode = 11;
  string kind = 12;
  string source_id = 13;
  string oauth_client_id = 14;
  bool has_oauth_client_secret = 15;
  string catalog_guide = 16;
}

message ListConnectorsRequest {}

message ListConnectorsResponse {
  repeated Connector connectors = 1;
}

message HeaderInput {
  string name = 1;
  string value = 2;
}

message CreateConnectorRequest {
  string name = 1;
  string description = 2;
  bytes image = 3;
  string image_type = 4;
  string transport = 5;
  string http_url = 6;
  string auth = 7;
  repeated HeaderInput headers = 8;
  string default_mode = 9;
  string oauth_client_id = 10;
  string oauth_client_secret = 11;
}

message UpdateConnectorRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  bytes image = 4;
  string image_type = 5;
  bool clear_image = 6;
  string transport = 7;
  string http_url = 8;
  string auth = 9;
  repeated HeaderInput headers = 10;
  string default_mode = 11;
  string oauth_client_id = 12;
  string oauth_client_secret = 13;
}

message DeleteConnectorRequest {
  string id = 1;
}

message DeleteConnectorResponse {}

message BotConnector {
  string id = 1;
  string bot_id = 2;
  Connector connector = 3;
  string auth_status = 4;
  string last_error = 5;
}

message ListBotConnectorsRequest {
  string bot_id = 1;
}

message ListBotConnectorsResponse {
  repeated BotConnector connectors = 1;
}

message AttachConnectorRequest {
  string bot_id = 1;
  string connector_id = 2;
}

message CreateBotConnectorRequest {
  string bot_id = 1;
  string name = 2;
  string description = 3;
  bytes image = 4;
  string image_type = 5;
  string transport = 6;
  string http_url = 7;
  string auth = 8;
  repeated HeaderInput headers = 9;
  string default_mode = 10;
  string oauth_client_id = 11;
  string oauth_client_secret = 12;
  string source_id = 13;
}

message DetachConnectorRequest {
  string bot_id = 1;
  string id = 2;
}

message DetachConnectorResponse {}

message RefreshBotConnectorRequest {
  string bot_id = 1;
  string id = 2;
}

message StartConnectorAuthRequest {
  string bot_id = 1;
  string id = 2;
}

message StartConnectorAuthResponse {
  string authorize_url = 1;
}
