  string id = 1;
  string name = 2;
  string description = 3;
  repeated ProviderField fields = 4;
  bool supports_cache = 5;
  repeated string cache_ttls = 6;
  // kinds are the kinds of model the provider serves: "text", "decision".
  repeated string kinds = 7;
}

