// ChangeSource is one run that was working while a change was made.
message ChangeSource {
  // "chat", "automation", "channel" or "subagent".
  string kind = 1;
  // The chat title, automation name, channel name or subagent name.
  string name = 2;
  string chat_id = 3;
}

// Change is what differs between two consecutive snapshots of the workspace.
message Change {
  // id is the newer snapshot; "" for the pending change (not snapshotted yet).
  string id = 1;
  string at = 2;
  // The runs live while it was made; none means it happened outside a run
  // (the owner in Files or the Console, or a background process).
  repeated ChangeSource sources = 3;
  // base and head name the two snapshots for ListChangeFiles/GetChangePatch.
  string base = 4;
  string head = 5;
  int32 files = 6;
  int32 added = 7;
  int32 deleted = 8;
  bool pending = 9;
  // restore: this change is the owner putting files back from the pane.
  bool restore = 10;
}

message ChangeFile {
  string path = 1;
  // old_path is where it was before a rename; "" otherwise.
  string old_path = 2;
  // "added", "modified", "deleted", "renamed", or "repo" (a nested git
  // repository, recorded by its commit only).
  string status = 3;
  int32 added = 4;
  int32 deleted = 5;
  bool binary = 6;
  // large: over the size cap, so only its size was recorded, not its content.
  bool large = 7;
  // Sizes in bytes; -1 on the side where the file does not exist.
  int64 old_size = 8;
  int64 new_size = 9;
}

message ListChangesRequest {
  string bot_id = 1;
}

message ListChangesResponse {
  // "ok", or "off" when the operator turned change tracking off.
  string state = 1;
  // pending is what changed since the last snapshot; unset when nothing did.
  Change pending = 2;
  repeated Change changes = 3;
  // since is when the history starts (the oldest snapshot kept).
  string since = 4;
  // What tracking leaves out, for the pane's footnote.
  int64 max_file_bytes = 5;
  // indexing: the first snapshots of a big workspace are still being taken.
  bool indexing = 6;
}

// DriveChangeEntry is one journal line: something done to a file on a drive.
message DriveChangeEntry {
  string id = 1;
  // The drive's name, as in /workspace/drives/<drive>.
  string drive = 2;
  // "added", "modified", "deleted" or "renamed".
  string op = 3;
  // Paths inside the drive.
  string path = 4;
  string old_path = 5;
  int64 size = 6;
  string at = 7;
  // The runs at work when it happened; none means outside a run.
  repeated ChangeSource sources = 8;
}

message ListDriveChangesRequest {
  string bot_id = 1;
}

message ListDriveChangesResponse {
  // "ok", or "off" when the operator turned change tracking off.
  string state = 1;
  repeated DriveChangeEntry changes = 2;
  // has_drives: the Bot has a drive, so the journal is worth showing empty.
  bool has_drives = 3;
  // keep is how many entries a Bot's journal holds.
  int32 keep = 4;
}

message ListChangeFilesRequest {
  string bot_id = 1;
  string base = 2;
  string head = 3;
}

message ListChangeFilesResponse {
  repeated ChangeFile files = 1;
  bool truncated = 2;
}

message GetChangePatchRequest {
  string bot_id = 1;
  string base = 2;
  string head = 3;
  string path = 4;
  string old_path = 5;
}

message GetChangePatchResponse {
  // patch is a unified diff (hunks only, no file header).
  string patch = 1;
  bool truncated = 2;
  bool binary = 3;
}

message RestoreChangeRequest {
  string bot_id = 1;
  // base and head of the change, as listed.
  string base = 2;
  string head = 3;
  // One file of the change; "" restores every file of it.
  string path = 4;
  string old_path = 5;
}

// RestoreSkip is a file a restore left as it is.
message RestoreSkip {
  string path = 1;
  // "large" (over the size cap: its content was never kept), "repo" (a nested
  // repository) or "blocked" (something else is in the way).
  string reason = 2;
}

message RestoreChangeResponse {
  int32 restored = 1;
  // The first few skipped files; skipped_total counts them all.
  repeated RestoreSkip skipped = 2;
  int32 skipped_total = 3;
}

