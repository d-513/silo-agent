// DashboardCard is one ask on a Bot's Dashboard: something the Bot needs the
// owner to decide, with optional form controls and a submit button.
message DashboardCard {
  string id = 1;
  string bot_id = 2;
  // Optional stable slug per topic (e.g. "workspace-hygiene") for gradual updates.
  string key = 3;
  string title = 4;
  string summary = 5;
  // 1 = high priority (expanded by default), 2 = normal, 3 = low.
  int32 priority = 6;
  // JSON array of display blocks and interactive form controls.
  string blocks_json = 7;
  // Primary submit button label (e.g. "Send", "Run cleanup").
  string submit_label = 8;
  reserved 9, 10;
  // "open", "submitted", or "dismissed".
  string status = 11;
  string source_kind = 12;
  string source_name = 13;
  string chat_id = 14;
  string created_at = 15;
  string updated_at = 16;
  bool read = 17;
}

// SetupOffer is the Bot offering something from the catalog to add: a
// library connector (target = its identifier), a channel adapter or a drive
// provider, with the add form's values it filled in.
message SetupOffer {
  string id = 1;
  // connector, channel or drive.
  string kind = 2;
  string target = 3;
  // The catalog's name for it.
  string label = 4;
  string why = 5;
  // The form's values the Bot filled in: plain fields and options such as
  // name, default_mode, expose_completion, read_only ("true"/"false").
  map<string, string> options = 6;
  // open, done or skipped.
  string status = 7;
  string chat_id = 8;
  string created_at = 9;
}

// ResolveSetupOffer records what the owner did with an offer and tells the
// Bot in its chat.
message ResolveSetupOfferRequest {
  string bot_id = 1;
  string id = 2;
  // done or skipped.
  string outcome = 3;
  // rest also skips every other open offer made in the same turn.
  bool rest = 4;
}

