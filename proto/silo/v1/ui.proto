syntax = "proto3";

package silo.v1;

option go_package = "silo.agent/gen/silo/v1;silov1";

service UI {
  rpc SignIn(SignInRequest) returns (SignInResponse);
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  rpc Me(MeRequest) returns (MeResponse);
  // AuthOptions is how this server lets people sign in. The sign-in page asks
  // before anyone is signed in, as do GetInvite and AcceptInvite.
  rpc AuthOptions(AuthOptionsRequest) returns (AuthOptionsResponse);
  rpc GetInvite(GetInviteRequest) returns (InviteInfo);
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);
  // The signed-in user's own account.
  // ChangeEmail sets the address the signed-in user signs in with. Nothing is
  // sent to it: Silo has no mail.
  rpc ChangeEmail(ChangeEmailRequest) returns (User);
  // SetLanguage picks the language the signed-in user reads the console in.
  rpc SetLanguage(SetLanguageRequest) returns (User);
  rpc ChangePassword(ChangePasswordRequest) returns (User);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (ListSessionsResponse);
  rpc RevokeOtherSessions(RevokeOtherSessionsRequest) returns (ListSessionsResponse);
  rpc StartTOTP(StartTOTPRequest) returns (StartTOTPResponse);
  rpc ConfirmTOTP(ConfirmTOTPRequest) returns (RecoveryCodes);
  rpc DisableTOTP(DisableTOTPRequest) returns (User);
  rpc NewRecoveryCodes(NewRecoveryCodesRequest) returns (RecoveryCodes);
  // Admin: everyone's accounts, and the invite links that make new ones.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc CreateInvite(CreateInviteRequest) returns (Invite);
  rpc DeleteInvite(DeleteInviteRequest) returns (DeleteInviteResponse);
  // CheckOIDC asks the configured OIDC provider for its discovery document,
  // with the saved settings.
  rpc CheckOIDC(CheckOIDCRequest) returns (CheckOIDCResponse);

  // Workspaces: the containers of Bots, the people who use them, and what
  // their Bots share. ListSpaces is the caller's memberships, and makes their
  // first Workspace if they own none.
  rpc ListSpaces(ListSpacesRequest) returns (ListSpacesResponse);
  rpc GetSpace(GetSpaceRequest) returns (Space);
  rpc CreateSpace(CreateSpaceRequest) returns (Space);
  rpc UpdateSpace(UpdateSpaceRequest) returns (Space);
  // DeleteSpace is the owner's, refused while the Workspace has Bots and for
  // the owner's last Workspace.
  rpc DeleteSpace(DeleteSpaceRequest) returns (DeleteSpaceResponse);
  // TransferSpace makes an admin the owner; the old owner becomes an admin.
  rpc TransferSpace(TransferSpaceRequest) returns (Space);

  // The people of a Workspace. Members see the list; admins change roles
  // (an admin only among members and guests) and remove people.
  rpc ListSpacePeople(ListSpacePeopleRequest) returns (ListSpacePeopleResponse);
  rpc SetSpaceRole(SetSpaceRoleRequest) returns (SpacePerson);
  // PlanSpaceRemoval is what removing a person (or leaving: user_id is the
  // caller) would do: the Bots they are the last manager of, and what they
  // lent. RemoveSpacePerson does it, with a choice for each such Bot.
  rpc PlanSpaceRemoval(PlanSpaceRemovalRequest) returns (SpaceRemovalPlan);
  rpc RemoveSpacePerson(RemoveSpacePersonRequest) returns (RemoveSpacePersonResponse);
  // Invite links: single use, 7 days, only the hash kept. Opening one signed
  // in joins (JoinSpace); with spaces.invite_signup on, a visitor with no
  // account makes one there (JoinSpace with email and password).
  rpc CreateSpaceInvite(CreateSpaceInviteRequest) returns (SpaceInviteLink);
  rpc ListSpaceInvites(ListSpaceInvitesRequest) returns (ListSpaceInvitesResponse);
  rpc DeleteSpaceInvite(DeleteSpaceInviteRequest) returns (DeleteSpaceInviteResponse);
  rpc GetSpaceInvite(GetSpaceInviteRequest) returns (SpaceInviteInfo);
  rpc JoinSpace(JoinSpaceRequest) returns (JoinSpaceResponse);

  // The people on a Bot: Can manage or Can use. Managers change the list;
  // anyone may leave a Bot unless they are its last manager.
  rpc ListBotPeople(ListBotPeopleRequest) returns (ListBotPeopleResponse);
  rpc AddBotPerson(AddBotPersonRequest) returns (AddBotPersonResponse);
  rpc SetBotRole(SetBotRoleRequest) returns (BotPerson);
  rpc RemoveBotPerson(RemoveBotPersonRequest) returns (RemoveBotPersonResponse);
  // SetLendShared is a lender's say-so on a connection or drive that carries
  // their identity: shared, any Bot of the Workspace may get it; personal
  // (the default), only Bots they alone use.
  rpc SetLendShared(SetLendSharedRequest) returns (SetLendSharedResponse);
  // The Workspace's guardrails: for an action, the least strict mode any of
  // its Bots may use (a floor between the operator's and each Bot's own), and
  // its policy texts, read after the operator's and before the Bot's.
  rpc ListSpaceRules(ListSpaceRulesRequest) returns (ListSpaceRulesResponse);
  rpc SetSpaceRule(SetSpaceRuleRequest) returns (Rule);
  rpc UpdateSpacePolicy(UpdateSpacePolicyRequest) returns (ListSpaceRulesResponse);
  // What happened in the Workspace: people, Bots made and deleted, grants,
  // sign-ins and lending. Never what a Bot did with a grant.
  rpc ListSpaceActivity(ListSpaceActivityRequest) returns (ListSpaceActivityResponse);
  // Moving a Bot to another Workspace (a manager of it who may build in the
  // target): PlanMoveBot says what it loses (its grants, its Workspace
  // skills, the people not in the target); MoveBot does it.
  rpc PlanMoveBot(MoveBotRequest) returns (MoveBotPlan);
  rpc MoveBot(MoveBotRequest) returns (Bot);

  rpc ListBots(ListBotsRequest) returns (ListBotsResponse);
  rpc CreateBot(CreateBotRequest) returns (Bot);
  rpc UpdateBot(UpdateBotRequest) returns (Bot);
  rpc GetBot(GetBotRequest) returns (Bot);
  rpc GetContainer(GetBotRequest) returns (Container);
  rpc StartBot(GetBotRequest) returns (Bot);
  rpc StopBot(GetBotRequest) returns (Bot);
  rpc ResetContainer(GetBotRequest) returns (Bot);
  // SetDesktopPaused hands the desktop to the owner: while paused the Bot's
  // desktop actions and Chromium are refused with a note that the owner is
  // in control.
  rpc SetDesktopPaused(SetDesktopPausedRequest) returns (SetDesktopPausedResponse);
  // Every container that belongs to a Bot: its machine, drive sidecar, and
  // STDIO MCP sidecars, with usage.
  rpc ListBotContainers(GetBotRequest) returns (BotContainers);
  // Stop and remove all of them. Files, drives, and connectors stay; each
  // container is made again when it is next needed.
  rpc RemoveBotContainers(GetBotRequest) returns (Bot);
  // Admin: everything Silo has on the container engine — every user's Bots
  // with their machines, drive and MCP sidecars, the egress gateway, and any
  // Silo container left over that the database no longer claims — plus each
  // client network and the containers it carries. Nothing the engine hosts
  // for anyone else is listed or touched.
  rpc ListAdminContainers(ListAdminContainersRequest) returns (AdminContainers);
  // Start, stop, or remove one container by the engine name the list named.
  // Bot machines go through the Bot's own lifecycle; everything else is one
  // engine action on that container. The server refuses a name the list did
  // not carry.
  rpc AdminContainerAction(AdminContainerActionRequest) returns (AdminActionResponse);
  // Remove one Bot's containers, the owner's Remove all without the
  // ownership check.
  rpc RemoveAdminBotContainers(GetBotRequest) returns (AdminActionResponse);
  rpc DeleteBot(GetBotRequest) returns (DeleteBotResponse);
  rpc ListMemories(ListMemoriesRequest) returns (ListMemoriesResponse);
  rpc SearchMemories(SearchMemoriesRequest) returns (SearchMemoriesResponse);
  rpc DeleteMemory(DeleteMemoryRequest) returns (DeleteMemoryResponse);
  // Knowledge: workspace folders (drives included) indexed for search_docs.
  rpc ListKnowledge(ListKnowledgeRequest) returns (ListKnowledgeResponse);
  rpc AddKnowledgeFolder(AddKnowledgeFolderRequest) returns (KnowledgeFolder);
  rpc RemoveKnowledgeFolder(RemoveKnowledgeFolderRequest) returns (RemoveKnowledgeFolderResponse);
  // SyncKnowledge starts a sync in the background and returns the folder as
  // "syncing"; the page polls ListKnowledge.
  rpc SyncKnowledge(SyncKnowledgeRequest) returns (KnowledgeFolder);
  rpc SearchKnowledge(SearchKnowledgeRequest) returns (SearchKnowledgeResponse);
  rpc ListFeed(ListFeedRequest) returns (ListFeedResponse);
  rpc MarkFeedRead(MarkFeedReadRequest) returns (MarkFeedReadResponse);
  rpc DeleteFeedPost(DeleteFeedPostRequest) returns (DeleteFeedPostResponse);
  rpc QuoteFeedPost(QuoteFeedPostRequest) returns (QuoteFeedPostResponse);
  // Dashboard: declarative modular form cards curated by the Bot.
  rpc ListDashboard(ListDashboardRequest) returns (ListDashboardResponse);
  rpc MarkDashboardRead(MarkDashboardReadRequest) returns (MarkDashboardReadResponse);
  rpc DismissDashboardCard(DismissDashboardCardRequest) returns (DismissDashboardCardResponse);
  rpc SubmitDashboardCard(SubmitDashboardCardRequest) returns (SubmitDashboardCardResponse);
  rpc ResolveSetupOffer(ResolveSetupOfferRequest) returns (SetupOffer);
  // Widgets: what the Bot keeps on the Dashboard and code keeps current.
  rpc RefreshWidget(RefreshWidgetRequest) returns (DashboardWidget);
  rpc SetWidgetState(SetWidgetStateRequest) returns (DashboardWidget);
  rpc RunWidgetAction(RunWidgetActionRequest) returns (RunWidgetActionResponse);
  rpc ArrangeDashboard(ArrangeDashboardRequest) returns (ArrangeDashboardResponse);
  rpc RemoveWidget(RemoveWidgetRequest) returns (RemoveWidgetResponse);
  // AskDashboard hands the owner's words about the Dashboard to the Bot in
  // the Dashboard automation's log, with the widget they picked.
  rpc AskDashboard(AskDashboardRequest) returns (AskDashboardResponse);
  // Tunnels: named, owner-or-public URLs into services on a Bot's localhost.
  rpc ListTunnels(ListTunnelsRequest) returns (ListTunnelsResponse);
  rpc CreateTunnel(CreateTunnelRequest) returns (Tunnel);
  rpc UpdateTunnel(UpdateTunnelRequest) returns (Tunnel);
  rpc DeleteTunnel(DeleteTunnelRequest) returns (DeleteTunnelResponse);
  // Mail: each Bot's receive-only mailbox, fed by the CP's SMTP listener.
  rpc ListMail(ListMailRequest) returns (ListMailResponse);
  rpc GetMail(GetMailRequest) returns (Mail);
  rpc DeleteMail(DeleteMailRequest) returns (DeleteMailResponse);
  rpc UpdateMailbox(UpdateMailboxRequest) returns (Mailbox);
  rpc RotateMailbox(RotateMailboxRequest) returns (Mailbox);
  rpc ListAutomations(ListAutomationsRequest) returns (ListAutomationsResponse);
  rpc CreateAutomation(CreateAutomationRequest) returns (Automation);
  rpc UpdateAutomation(UpdateAutomationRequest) returns (Automation);
  rpc DeleteAutomation(DeleteAutomationRequest) returns (DeleteAutomationResponse);
  rpc RunAutomation(RunAutomationRequest) returns (RunAutomationResponse);

  rpc ListChats(ListChatsRequest) returns (ListChatsResponse);
  rpc CreateChat(CreateChatRequest) returns (Chat);
  rpc RenameChat(RenameChatRequest) returns (Chat);
  rpc DeleteChat(DeleteChatRequest) returns (DeleteChatResponse);
  rpc SetChatModel(SetChatModelRequest) returns (Chat);
  // SetChatThinking sets the chat's thinking level ("" is the model default).
  rpc SetChatThinking(SetChatThinkingRequest) returns (Chat);

  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse);

  rpc Send(SendRequest) returns (SendResponse);
  rpc StopRun(StopRunRequest) returns (StopRunResponse);
  rpc StreamRun(StreamRunRequest) returns (stream RunEvent);
  // ListChatEvents is a page of a chat's thread before an event: StreamRun
  // replays only the newest turns and opens with an "earlier" event when
  // there is more.
  rpc ListChatEvents(ListChatEventsRequest) returns (ListChatEventsResponse);
  // ListCommands is the slash commands a chat's composer offers.
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);
  rpc EditMessage(EditMessageRequest) returns (SendResponse);
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
  rpc DivergeChat(DivergeChatRequest) returns (DivergeChatResponse);
  rpc CompactChat(CompactChatRequest) returns (CompactChatResponse);
  rpc CollectMemories(CollectMemoriesRequest) returns (CollectMemoriesResponse);
  rpc ListSubagents(ListSubagentsRequest) returns (ListSubagentsResponse);
  rpc GetSubagent(GetSubagentRequest) returns (Subagent);
  rpc StopSubagent(StopSubagentRequest) returns (StopSubagentResponse);
  rpc GetTaskboard(GetTaskboardRequest) returns (Taskboard);
  rpc ClearTaskboard(ClearTaskboardRequest) returns (Taskboard);

  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc AddSecret(AddSecretRequest) returns (SecretMeta);
  // UpdateSecret changes a secret's name, value, mode or allowed hosts. Only
  // the fields set are touched; a value re-writes the stand-in.
  rpc UpdateSecret(UpdateSecretRequest) returns (SecretMeta);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);

  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  rpc DecideApproval(DecideApprovalRequest) returns (Approval);

  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc SetRule(SetRuleRequest) returns (Rule);
  // The operator's layer of the rules engine. Admin only: these rows are the
  // installation's, not one Bot's, and an owner may tighten a locked one but
  // not loosen it.
  rpc ListOperatorRules(ListOperatorRulesRequest) returns (ListOperatorRulesResponse);
  rpc SetOperatorRule(SetOperatorRuleRequest) returns (OperatorRule);
  rpc DeleteOperatorRule(DeleteOperatorRuleRequest) returns (DeleteOperatorRuleResponse);

  // Changes: what changed in the Bot's workspace, as diffs between snapshots
  // its worker takes around every run.
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse);
  rpc ListChangeFiles(ListChangeFilesRequest) returns (ListChangeFilesResponse);
  rpc GetChangePatch(GetChangePatchRequest) returns (GetChangePatchResponse);
  // RestoreChange puts files back as they were before a change: one file, or
  // with no path every file of the change. The state it replaces is snapshotted
  // first, so the restore shows as a change of its own and can be undone.
  rpc RestoreChange(RestoreChangeRequest) returns (RestoreChangeResponse);
  // What was written, deleted or renamed on the Bot's drives: a journal kept by
  // the drive sidecar, with no content and no diffs.
  rpc ListDriveChanges(ListDriveChangesRequest) returns (ListDriveChangesResponse);

  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc Mkdir(MkdirRequest) returns (FileOpResponse);
  rpc RemoveFile(RemoveFileRequest) returns (FileOpResponse);
  rpc PutFile(PutFileRequest) returns (FileOpResponse);

  rpc GetSettings(GetSettingsRequest) returns (Settings);
  rpc PutSettings(PutSettingsRequest) returns (Settings);
  rpc SetModels(SetModelsRequest) returns (Settings);
  rpc ListProviderModels(ListProviderModelsRequest) returns (ListProviderModelsResponse);
  rpc SetConnectorVars(SetConnectorVarsRequest) returns (Settings);
  rpc SetAutoenableConnectors(SetAutoenableConnectorsRequest) returns (Settings);

  // The audit timeline: tool calls and their decisions, tool results the output
  // filter did not pass, and what the network filter blocked or flagged. With a
  // bot_id an owner sees their Bot's; with none an admin sees the whole
  // installation's.
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
  // AuditSummary is the counts behind the page and the attention badge.
  rpc AuditSummary(AuditSummaryRequest) returns (AuditSummaryResponse);
  // MarkAuditRead clears one Bot's attention badge.
  rpc MarkAuditRead(MarkAuditReadRequest) returns (AuditSummaryResponse);
  // ListTraffic is the network filter's sums: per Bot, per host.
  rpc ListTraffic(ListTrafficRequest) returns (ListTrafficResponse);

  // The Bot's own network lists (on top of the operator's) and whether it may
  // talk to something that is not HTTP.
  rpc GetBotNetwork(GetBotNetworkRequest) returns (BotNetwork);
  rpc AddHostPattern(AddHostPatternRequest) returns (BotNetwork);
  rpc RemoveHostPattern(RemoveHostPatternRequest) returns (BotNetwork);
  rpc SetOtherProtocols(SetOtherProtocolsRequest) returns (BotNetwork);

  // The filter itself, for admins: whether it is on, how it is doing, and the
  // key it decrypts with.
  rpc GetEgressStatus(GetEgressStatusRequest) returns (EgressStatus);
  rpc RotateEgressCA(RotateEgressCARequest) returns (EgressStatus);

  rpc ListLLMLogs(ListLLMLogsRequest) returns (ListLLMLogsResponse);

  rpc ListConnectors(ListConnectorsRequest) returns (ListConnectorsResponse);
  rpc CreateConnector(CreateConnectorRequest) returns (Connector);
  rpc UpdateConnector(UpdateConnectorRequest) returns (Connector);
  rpc DeleteConnector(DeleteConnectorRequest) returns (DeleteConnectorResponse);

  rpc ListBotConnectors(ListBotConnectorsRequest) returns (ListBotConnectorsResponse);
  rpc AttachConnector(AttachConnectorRequest) returns (BotConnector);
  rpc CreateBotConnector(CreateBotConnectorRequest) returns (BotConnector);
  // DetachConnector takes a connection away from the Bot (its grant, by id);
  // the connection stays in the Workspace.
  rpc DetachConnector(DetachConnectorRequest) returns (DetachConnectorResponse);
  // A Workspace's connections, for its Customize hub and a Bot's Workspace
  // pill.
  rpc ListSpaceConnectors(ListSpaceConnectorsRequest) returns (ListConnectorsResponse);
  // Give a Workspace connection to a Bot of the same Workspace, or take it
  // away from one.
  rpc GrantConnector(GrantConnectorRequest) returns (BotConnector);
  rpc RevokeConnector(RevokeConnectorRequest) returns (RevokeConnectorResponse);
  rpc RefreshBotConnector(RefreshBotConnectorRequest) returns (BotConnector);
  rpc StartConnectorAuth(StartConnectorAuthRequest) returns (StartConnectorAuthResponse);

  rpc SeedConnectors(SeedConnectorsRequest) returns (SeedConnectorsResponse);
  rpc SeedSkills(SeedSkillsRequest) returns (SeedSkillsResponse);
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc InstallSkill(InstallSkillRequest) returns (InstallSkillResponse);
  rpc DeleteSkill(DeleteSkillRequest) returns (DeleteSkillResponse);
  rpc ListBotSkills(ListBotSkillsRequest) returns (ListBotSkillsResponse);
  rpc SetBotSkill(SetBotSkillRequest) returns (BotSkill);
  rpc ListSkillFiles(ListSkillFilesRequest) returns (ListFilesResponse);
  rpc ReadSkillFile(ReadSkillFileRequest) returns (ReadFileResponse);
  rpc SaveSkill(SaveSkillRequest) returns (SaveSkillResponse);
  // Artifacts: a card's versions and pinned files, a live app's address, and
  // the owner's public links.
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse);
  rpc DeleteArtifact(DeleteArtifactRequest) returns (DeleteArtifactResponse);
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse);
  rpc ReadArtifactFile(ReadArtifactFileRequest) returns (ReadArtifactFileResponse);
  rpc OpenArtifactApp(OpenArtifactAppRequest) returns (OpenArtifactAppResponse);
  rpc ShareArtifact(ShareArtifactRequest) returns (ArtifactShare);
  rpc ListArtifactShares(ListArtifactSharesRequest) returns (ListArtifactSharesResponse);
  rpc DeleteArtifactShare(DeleteArtifactShareRequest) returns (DeleteArtifactShareResponse);

  rpc ListChannelAdapters(ListChannelAdaptersRequest) returns (ListChannelAdaptersResponse);
  rpc ListBotChannels(ListBotChannelsRequest) returns (ListBotChannelsResponse);
  rpc CreateChannel(CreateChannelRequest) returns (Channel);
  rpc UpdateChannel(UpdateChannelRequest) returns (Channel);
  rpc DeleteChannel(DeleteChannelRequest) returns (DeleteChannelResponse);
  rpc ChannelAction(ChannelActionRequest) returns (ChannelActionResponse);

  // Drives: rclone remotes mounted at /workspace/drives/<name>.
  rpc ListDriveTemplates(ListDriveTemplatesRequest) returns (ListDriveTemplatesResponse);
  rpc ListDrives(ListDrivesRequest) returns (ListDrivesResponse);
  rpc SaveDrive(SaveDriveRequest) returns (Drive);
  rpc DeleteDrive(DeleteDriveRequest) returns (DeleteDriveResponse);
  // A Workspace's drives, for its Customize hub and a Bot's From the
  // workspace list; and giving one to a Bot of the same Workspace, or taking
  // it away.
  rpc ListSpaceDrives(ListSpaceDrivesRequest) returns (ListDrivesResponse);
  rpc GrantDrive(GrantDriveRequest) returns (Drive);
  rpc RevokeDrive(RevokeDriveRequest) returns (RevokeDriveResponse);
  rpc BeginDriveAuth(BeginDriveAuthRequest) returns (BeginDriveAuthResponse);
  rpc PickDriveOptions(PickDriveOptionsRequest) returns (PickDriveOptionsResponse);
  rpc BrowseDrive(BrowseDriveRequest) returns (BrowseDriveResponse);
  // Admin: per-template system values (OAuth client ids and secrets).
  rpc GetDriveSettings(GetDriveSettingsRequest) returns (DriveSettings);
  rpc PutDriveSettings(PutDriveSettingsRequest) returns (DriveSettings);
}

message SignInRequest {
  string email = 1;
  string password = 2;
  // code is the authenticator (or a recovery) code, sent with the email and
  // password again after a response with needs_code.
  string code = 3;
}

message SignInResponse {
  User user = 1;
  bool created = 2;
  // needs_code: the password was right and the account has two-factor on.
  // Nobody is signed in yet.
  bool needs_code = 3;
}

message SignOutRequest {}

message SignOutResponse {}

message MeRequest {}

message MeResponse {
  User user = 1;
}

message User {
  string id = 1;
  string email = 2;
  bool admin = 3;
  bool disabled = 4;
  bool has_password = 5;
  // totp: two-factor is on for password sign-in.
  bool totp = 6;
  // oidc: the account is linked to an identity at the OIDC provider.
  bool oidc = 7;
  string created_at = 8;
  string last_sign_in_at = 9;
  // bots is how many Bots the user owns; set only by ListUsers.
  int32 bots = 10;
  // language is the display language of the console for this user: a code the
  // web is translated into (en, pl, de); never empty.
  string language = 11;
}

message AuthOptionsRequest {}

message AuthOptionsResponse {
  bool password = 1;
  bool oidc = 2;
  string oidc_label = 3;
}

message GetInviteRequest {
  string token = 1;
}

// InviteInfo is what an invite link's page shows before a password is picked.
message InviteInfo {
  string email = 1;
  // password_reset: the link sets a new password for an existing account.
  bool password_reset = 2;
}

message AcceptInviteRequest {
  string token = 1;
  string password = 2;
}

message AcceptInviteResponse {
  User user = 1;
  // signed_in is false after a reset: the person signs in with the new
  // password (and their second factor).
  bool signed_in = 2;
}

message ChangeEmailRequest {
  string email = 1;
}

message SetLanguageRequest {
  string language = 1;
}

message ChangePasswordRequest {
  // current is required when the account already has a password.
  string current = 1;
  string password = 2;
}

message Session {
  string id = 1;
  string created_at = 2;
  string last_seen_at = 3;
  string expires_at = 4;
  string user_agent = 5;
  string ip = 6;
  // method is password, oidc, or invite.
  string method = 7;
  // current: this is the session the request came on.
  bool current = 8;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message RevokeSessionRequest {
  string id = 1;
}

message RevokeOtherSessionsRequest {}

message StartTOTPRequest {
  string password = 1;
}

message StartTOTPResponse {
  string secret = 1;
  // url is the otpauth link; qr is the same as a PNG data URL.
  string url = 2;
  string qr = 3;
}

message ConfirmTOTPRequest {
  string code = 1;
}

// RecoveryCodes are shown once; only their hashes are kept.
message RecoveryCodes {
  repeated string codes = 1;
  User user = 2;
}

message DisableTOTPRequest {
  // An authenticator code or a recovery code.
  string code = 1;
}

message NewRecoveryCodesRequest {
  string code = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
  // Invite links that are still good.
  repeated Invite invites = 2;
}

message UpdateUserRequest {
  string id = 1;
  optional bool admin = 2;
  optional bool disabled = 3;
  // password, when set, replaces the user's password and signs them out.
  string password = 4;
  // reset_totp turns the user's two-factor off (a lost phone).
  bool reset_totp = 5;
  // email, when set, replaces the address the user signs in with. An address
  // an admin sets is one single sign-on may match an account by.
  string email = 6;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {}

message Invite {
  string id = 1;
  string email = 2;
  bool admin = 3;
  // user_id is set on a password-reset link.
  string user_id = 4;
  string created_at = 5;
  string expires_at = 6;
  // url is the link itself, returned by CreateInvite only: it cannot be read
  // back later.
  string url = 7;
}

message CreateInviteRequest {
  // A new account for email, or, with user_id, a link for that user to pick a
  // new password.
  string email = 1;
  bool admin = 2;
  string user_id = 3;
}

message DeleteInviteRequest {
  string id = 1;
}

message DeleteInviteResponse {}

message CheckOIDCRequest {}

message CheckOIDCResponse {
  string issuer = 1;
  string authorization_endpoint = 2;
}

message Bot {
  string id = 1;
  string name = 2;
  string status = 3;
  string last_task = 4;
  int32 crest = 5;
  bool worker_connected = 6;
  string description = 7;
  string soul = 8;
  reserved 9;
  // AutoApprove is this Bot's free-text auto-approval policy. Rules set to
  // "auto" consult the approval model with this text.
  string auto_approve = 10;
  // Model is this Bot's default provider/model. Empty falls back to the
  // operator default; a chat override still wins for its conversation.
  string model = 11;
  // FeedUnread counts Feed posts the owner has not seen yet.
  int32 feed_unread = 12;
  // MailAddress is this Bot's receive-only address; empty while the operator
  // has mail off or no mail.domain.
  string mail_address = 13;
  // TimeZone is the IANA zone this Bot's schedules and the times it reads are
  // in; never empty (a Bot with none set answers the server's).
  string time_zone = 14;
  // TimeZonePinned keeps the zone as set. Unpinned, it follows the device the
  // owner sends messages from.
  bool time_zone_pinned = 15;
  // Language is what this Bot writes to people in: a language code, or
  // "mixed" for whatever it is written to in. Never empty.
  string language = 16;
  // OutputPolicy is this Bot's free-text output policy: what the filter
  // model judges tool results by, for actions whose output rule is "check".
  // Empty means the built-in policy.
  string output_policy = 17;
  // AuditUnseen counts audit lines flagged for a human that the owner has not
  // opened the Bot's Audit tab over yet.
  int32 audit_unseen = 18;
  // DashboardAsks counts the Dashboard asks waiting for the owner.
  int32 dashboard_asks = 19;
  // DesktopPaused is the owner having taken the desktop over: the Bot's
  // clicks, keys, typing, scrolling and Chromium are refused until resumed.
  bool desktop_paused = 20;
  // Proactivity is how much the Bot does unasked: off, quiet or active.
  string proactivity = 21;
  // HeartbeatCustom: the Heartbeat runs on a schedule someone set by hand,
  // not the one its proactivity level gives it.
  bool heartbeat_custom = 22;
  // Activity is what the Bot is doing right now: one row per live run.
  repeated BotActivity activity = 23;
  // SpaceId is the Workspace the Bot is in.
  string space_id = 24;
  // Role is the caller's on the Bot: manage or use.
  string role = 25;
  // Everyone on the Bot, when it has more than one person (the sidebar's
  // people); empty for a Bot with one.
  repeated BotPerson people = 26;
  // Listed only (ListBots), for the Workspace's overview: when its newest
  // run started (RFC 3339, "" never), and the next automation that will
  // fire on its own, by name and time.
  string last_active_at = 27;
  string next_run_name = 28;
  string next_run_at = 29;
}

