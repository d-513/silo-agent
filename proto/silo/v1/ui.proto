  string id = 1;
  string type = 2;
  string name = 3;
  string description = 4;
  bool has_image = 5;
  string transport = 6;
  string http_url = 7;
  string auth = 8;
  repeated HeaderKey header_keys = 9;
  string created_at = 10;
  string default_mode = 11;
  string kind = 12;
  string source_id = 13;
  string oauth_client_id = 14;
  bool has_oauth_client_secret = 15;
  string catalog_guide = 16;
  string stdio_command = 17;
  repeated string stdio_args = 18;
  string stdio_image = 19;
  repeated EnvKey env_keys = 20;
  string prompt = 21;
  bool auto_attach = 22;
  string category = 23;
  // The `tools.<slug>` name; a chat `call` event's tool is `<slug>.<action>`.
  string slug = 24;
  // Built-in connectors (transport "builtin") run Go code on the CP. builtin
  // names the registry entry; fields are its declared config inputs. config
  // holds the non-secret values; secret values never leave the CP, only
  // secrets_set lists which are filled.
  string builtin = 25;
  repeated ChannelField fields = 26;
  map<string, string> config = 27;
  repeated string secrets_set = 28;
  // identifier names a library preset for the operator (lowercase letters,
  // digits and underscores; unique in the library). A Bot's copy has none.
  string identifier = 29;
  // autoenabled is true when autoenable_connectors names this preset, so new
  // Bots get it whatever auto_attach says.
  bool autoenabled = 30;
}

