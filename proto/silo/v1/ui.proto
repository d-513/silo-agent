message Container {
  bool running = 1;
  double cpu_percent = 2;
  int64 mem_used = 3;
  int64 mem_limit = 4;
}

// BotContainer is one container a Bot owns.
message BotContainer {
  // bot | drive | mcp
  string kind = 1;
  // Engine container name (silo-…).
  string name = 2;
  // What it is for a human: "Machine", "Drives", or the connector's name.
  string label = 3;
  // running | stopped | absent (not created yet, or removed)
  string state = 4;
  string image = 5;
  // RFC 3339; empty unless running.
  string started_at = 6;
  double cpu_percent = 7;
  int64 mem_used = 8;
  int64 mem_limit = 9;
  // One line of context: "3 drives", "stdio · npx @modelcontextprotocol/…".
  string detail = 10;
}

message BotContainers {
  repeated BotContainer containers = 1;
}

// AdminContainer is one container on the Admin Containers tab.
message AdminContainer {
  // bot | drive | mcp | egress | stray
  string kind = 1;
  // Engine container name (silo-…).
  string name = 2;
  // What it is for a human: "Machine", "Egress gateway", the connector's
  // name, or the bot name of a box whose bot row is gone.
  string label = 3;
  string state = 4; // running | stopped | absent
  string image = 5;
  // RFC 3339; empty unless running.
  string started_at = 6;
  double cpu_percent = 7;
  int64 mem_used = 8;
  int64 mem_limit = 9;
  // One line of context: "3 drives", "stdio · npx …", "leftover sidecar".
  string detail = 10;
  // The networks the container is attached to, by name.
  repeated string networks = 11;
}

// AdminNetwork is one network the CP carved for an egress client.
message AdminNetwork {
  string name = 1;
  string subnet = 2;
  // The containers the engine shows on the network, by name.
  repeated string containers = 3;
  // The Bot the network serves; empty on one nobody claims any more.
  string bot_id = 4;
}

// AdminBotGroup is one Bot's containers and networks under the Admin tab.
message AdminBotGroup {
  string bot_id = 1;
  string bot_name = 2;
  string status = 3;
  repeated AdminContainer containers = 4;
  repeated AdminNetwork networks = 5;
}

// AdminUserGroup is one user's Bots on the Admin Containers tab.
message AdminUserGroup {
  string user_id = 1;
  string email = 2;
  repeated AdminBotGroup bots = 3;
}

// AdminSystemGroup is what the Admin tab cannot pin on a live Bot: the egress
// gateway, leftover containers, and networks nobody claims any more.
message AdminSystemGroup {
  repeated AdminContainer containers = 1;
  repeated AdminNetwork networks = 2;
}

message AdminContainers {
  // podman | docker, from the engine itself.
  string runtime = 1;
  repeated AdminUserGroup users = 2;
  AdminSystemGroup system = 3;
}

message ListAdminContainersRequest {}

