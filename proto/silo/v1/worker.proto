syntax = "proto3";

package silo.v1;

option go_package = "silo.agent/gen/silo/v1;silov1";

service BotWorker {
  rpc Commands(stream CmdEvent) returns (stream Cmd);
  rpc GetSecret(SecretReq) returns (SecretRes);
  rpc CallTool(ToolReq) returns (ToolRes);
  rpc VNC(stream Frame) returns (stream Frame);
  rpc Console(stream ConsoleIO) returns (stream ConsoleIO);
}

message Cmd {
  string id = 1;
  string run_id = 9;
  oneof body {
    TerminalCmd terminal = 2;
    ExecPythonCmd exec_python = 3;
    FileReadCmd file_read = 4;
    FileWriteCmd file_write = 5;
    FilePatchCmd file_patch = 6;
    GrepCmd grep = 7;
    CancelCmd cancel = 8;
    DirListCmd dir_list = 10;
    BrowseFileCmd browse_file = 11;
    MkdirCmd mkdir = 12;
    RemoveCmd remove = 13;
    PutFileCmd put_file = 14;
    SyncToolsCmd sync_tools = 15;
    EnsureChromeCmd ensure_chrome = 16;
  }
}

message ToolStub {
  string connector = 1;
  string action = 2;
  string description = 3;
  string args_schema_json = 4;
}

message SyncToolsCmd {
  repeated ToolStub stubs = 1;
}

message ToolReq {
  string connector = 1;
  string action = 2;
  string args_json = 3;
  string run_id = 4;
}

message ToolRes {
  string result_json = 1;
  string error = 2;
}

message TerminalCmd {
  string command = 1;
}

message ExecPythonCmd {
  string code = 1;
}

message FileReadCmd {
  string path = 1;
  int32 offset = 2;
  int32 limit = 3;
}

message FileWriteCmd {
  string path = 1;
  string content = 2;
}

message FilePatchCmd {
  string path = 1;
  string old_text = 2;
  string new_text = 3;
}

message GrepCmd {
  string pattern = 1;
  string path = 2;
  string include = 3;
  int32 max_hits = 4;
}

message CancelCmd {
  string cmd_id = 1;
}

message DirListCmd {
  string path = 1;
}

message BrowseFileCmd {
  string path = 1;
}

message MkdirCmd {
  string path = 1;
}

message RemoveCmd {
  string path = 1;
}

message PutFileCmd {
  string path = 1;
  bytes data = 2;
}

message EnsureChromeCmd {}

message CmdEvent {
  string id = 1;
  oneof body {
    Heartbeat heartbeat = 2;
    OutputChunk chunk = 3;
    CmdDone done = 4;
    CmdError error = 5;
  }
}

message Heartbeat {}

message OutputChunk {
  string text = 1;
}

message CmdDone {
  string result = 1;
}

message CmdError {
  string message = 1;
}

message SecretReq {
  string name = 1;
  string run_id = 2;
}

message SecretRes {
  string value = 1;
  string error = 2;
}

message Frame {
  bytes data = 1;
}

message ConsoleIO {
  bytes data = 1;
  int32 rows = 2;
  int32 cols = 3;
}
