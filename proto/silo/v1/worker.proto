syntax = "proto3";

package silo.v1;

option go_package = "silo.agent/gen/silo/v1;silov1";

service BotWorker {
  rpc Commands(stream CmdEvent) returns (stream Cmd);
  rpc GetSecret(SecretReq) returns (SecretRes);
  rpc CallTool(ToolReq) returns (ToolRes);
  rpc VNC(stream Frame) returns (stream Frame);
  rpc Console(stream ConsoleIO) returns (stream ConsoleIO);
  // Tunnel carries one proxied TCP connection into the Bot: the CP asks for it
  // with Cmd.open_tunnel, the worker dials the port and opens this stream.
  rpc Tunnel(stream TunnelFrame) returns (stream TunnelFrame);
}

message Cmd {
  string id = 1;
  string run_id = 9;
  oneof body {
    TerminalCmd terminal = 2;
    ExecPythonCmd exec_python = 3;
    FileReadCmd file_read = 4;
    FileWriteCmd file_write = 5;
    FilePatchCmd file_patch = 6;
    GrepCmd grep = 7;
    CancelCmd cancel = 8;
    DirListCmd dir_list = 10;
    BrowseFileCmd browse_file = 11;
    MkdirCmd mkdir = 12;
    RemoveCmd remove = 13;
    PutFileCmd put_file = 14;
    SyncToolsCmd sync_tools = 15;
    EnsureChromeCmd ensure_chrome = 16;
    LookCmd look = 17;
    ClickCmd click = 18;
    TypeCmd type = 19;
    KeyCmd key = 20;
    ScrollCmd scroll = 21;
    SyncSkillsCmd sync_skills = 22;
    WalkCmd walk = 23;
    ExtractCmd extract = 24;
    OpenTunnelCmd open_tunnel = 25;
    CheckpointCmd checkpoint = 26;
    ChangesCmd changes = 27;
    ChangeFilesCmd change_files = 28;
    ChangePatchCmd change_patch = 29;
  }
}

message ToolStub {
  string connector = 1;
  string action = 2;
  string description = 3;
  string args_schema_json = 4;
}

message SyncToolsCmd {
  repeated ToolStub stubs = 1;
}

message ToolReq {
  string connector = 1;
  string action = 2;
  string args_json = 3;
  string run_id = 4;
}

message ToolRes {
  string result_json = 1;
  string error = 2;
}

message TerminalCmd {
  string command = 1;
}

message ExecPythonCmd {
  string code = 1;
}

message FileReadCmd {
  string path = 1;
  int32 offset = 2;
  int32 limit = 3;
}

message FileWriteCmd {
  string path = 1;
  string content = 2;
}

message FilePatchCmd {
  string path = 1;
  string old_text = 2;
  string new_text = 3;
}

message GrepCmd {
  string pattern = 1;
  string path = 2;
  string include = 3;
  int32 max_hits = 4;
}

message CancelCmd {
  string cmd_id = 1;
}

message DirListCmd {
  string path = 1;
}

message BrowseFileCmd {
  string path = 1;
  int64 limit = 2;
}

// WalkCmd lists every regular file under a folder, recursively, for the
// knowledge index: path, size and mtime only (no reads). An unreadable root is
// an error, never an empty list.
message WalkCmd {
  string path = 1;
  // Stop after this many files and report truncated (0 = worker default).
  int32 max_files = 2;
}

// ExtractCmd reads one file and returns its plain text plus the sha256 of its
// bytes: text as is, PDF through pdftotext, documents through pandoc.
message ExtractCmd {
  string path = 1;
  // Cap on the returned text (0 = worker default).
  int64 max_bytes = 2;
  // Read scanned PDF pages and image files with tesseract. Off, a scan is
  // reported (detail says OCR is off) instead of read.
  bool ocr = 3;
}

// HistoryLimits bound what the workspace history keeps. Zero fields take the
// worker's defaults.
message HistoryLimits {
  // A file over this many bytes is recorded by size and mtime only.
  int64 max_file_bytes = 1;
  // Checkpoints kept, newest first, and for how many days.
  int32 keep = 2;
  int32 keep_days = 3;
  // The store's size budget; over it the oldest half of the history goes.
  int64 max_store_bytes = 4;
}

// CheckpointCmd snapshots the workspace into the Bot's history store (a shadow
// git repository outside /workspace; drives/, tmp/, bot/ and heavy trees are
// never read). It answers JSON: the checkpoint id and whether anything changed
// since the last one — an unchanged tree makes no checkpoint.
message CheckpointCmd {
  // note is stored with the checkpoint and handed back by ChangesCmd as is:
  // the control plane's own JSON (who was running).
  string note = 1;
  HistoryLimits limits = 2;
}

// ChangesCmd lists the change sets between consecutive checkpoints, newest
// first, plus what changed since the last one (pending). With no history yet it
// takes the first checkpoint.
message ChangesCmd {
  int32 limit = 1;
  HistoryLimits limits = 2;
}

// ChangeFilesCmd lists the files that differ between two history objects
// (ids from ChangesCmd: base and head).
message ChangeFilesCmd {
  string base = 1;
  string head = 2;
  // Stop after this many files and report truncated (0 = worker default).
  int32 max_files = 3;
}

// ChangePatchCmd returns one file's unified diff between two history objects.
message ChangePatchCmd {
  string base = 1;
  string head = 2;
  string path = 3;
  // The path before a rename ("" when it did not move).
  string old_path = 4;
  // Cap on the returned patch (0 = worker default).
  int64 max_bytes = 5;
}

// OpenTunnelCmd asks the worker to dial 127.0.0.1:port inside the Bot and open
// a Tunnel stream for it, named conn_id. It gets no CmdDone: the stream is the
// answer.
message OpenTunnelCmd {
  string conn_id = 1;
  int32 port = 2;
}

// TunnelFrame is one chunk of a proxied connection. The worker's first frame
// names the connection (conn_id) or reports a failed dial (error); every later
// frame, in both directions, carries data only.
message TunnelFrame {
  string conn_id = 1;
  bytes data = 2;
  string error = 3;
}

message MkdirCmd {
  string path = 1;
}

message RemoveCmd {
  string path = 1;
}

message PutFileCmd {
  string path = 1;
  bytes data = 2;
}

message EnsureChromeCmd {}

message LookCmd {}

message ClickCmd {
  int32 x = 1;
  int32 y = 2;
  string button = 3;
}

message TypeCmd {
  string text = 1;
}

message KeyCmd {
  string name = 1;
}

message ScrollCmd {
  int32 x = 1;
  int32 y = 2;
  int32 dy = 3;
}

message SkillFile {
  string path = 1;
  bytes data = 2;
}

message SyncSkillsCmd {
  repeated SkillFile files = 1;
}

message CmdEvent {
  string id = 1;
  oneof body {
    Heartbeat heartbeat = 2;
    OutputChunk chunk = 3;
    CmdDone done = 4;
    CmdError error = 5;
  }
}

message Heartbeat {}

message OutputChunk {
  string text = 1;
}

message CmdDone {
  string result = 1;
  // image is a data: URL of a fresh desktop screenshot captured while the
  // command ran (Python/terminal look). Empty when the screen did not change.
  string image = 2;
}

message CmdError {
  string message = 1;
}

message SecretReq {
  string name = 1;
  string run_id = 2;
}

message SecretRes {
  string value = 1;
  string error = 2;
}

message Frame {
  bytes data = 1;
}

message ConsoleIO {
  bytes data = 1;
  int32 rows = 2;
  int32 cols = 3;
}
