# Dev dependencies only. The control plane and Vite run locally (`make dev`).
#   make db-up     start Postgres (pgvector) on localhost:5433 and the shared
#                  Lightpanda MCP (HTTP) on localhost:9223/mcp, and smtp4dev
#                  (SMTP :1025, IMAP :1143, web UI http://localhost:8025), and
#                  Radicale CalDAV on http://localhost:5232
#   make db-psql   open psql
#   make db-reset  drop the volume (all data)
name: silodb

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg17
    # Not silo-*: `make cleanup` force-removes every ^silo- container.
    container_name: silodb-postgres
    # Test packages run in parallel, each with its own pool.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: silo
      POSTGRES_PASSWORD: silo
      POSTGRES_DB: silo
    ports:
      - "5433:5432"
    volumes:
      - silodb-pg:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silo -d silo"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # One shared headless browser for every Bot's Lightpanda connector. HTTP MCP
  # gives each client session its own browsing context. The preset URL is
  # ${LIGHTPANDA_URL}/mcp; set LIGHTPANDA_URL=http://localhost:9223 in Admin.
  lightpanda:
    image: docker.io/lightpanda/browser:nightly
    container_name: silodb-lightpanda
    command: ["/bin/lightpanda", "mcp", "--host", "0.0.0.0", "--port", "9223", "--block-private-networks"]
    ports:
      - "127.0.0.1:9223:9223"
    restart: unless-stopped

  # Local mail server for the Email built-in connector (smtp4dev). SMTP
  # accepts anything; IMAP logs in as silo/silo and shows every message.
  # Inbox UI: http://localhost:8025. In the connector use SMTP localhost:1025
  # and IMAP localhost:1143, both without TLS, user/password silo/silo.
  smtp4dev:
    image: docker.io/rnwood/smtp4dev:latest
    container_name: silodb-smtp4dev
    environment:
      ServerOptions__ImapPort: "143"
      ServerOptions__Users__0__Username: silo
      ServerOptions__Users__0__Password: silo
      ServerOptions__Users__0__DefaultMailbox: Default
    ports:
      - "127.0.0.1:1025:25"
      - "127.0.0.1:1143:143"
      - "127.0.0.1:8025:80"
    restart: unless-stopped

  # Local CalDAV server for the Calendar built-in connector (Radicale). In the
  # connector pick Other, URL http://localhost:5232, user/password silo/silo.
  # Each user gets one "Calendar" collection on first login.
  radicale:
    image: docker.io/tomsquest/docker-radicale:latest
    container_name: silodb-radicale
    volumes:
      - ./deploy/radicale:/config:ro
      - silodb-radicale:/data
    ports:
      - "127.0.0.1:5232:5232"
    restart: unless-stopped

volumes:
  silodb-radicale:
  silodb-pg:
