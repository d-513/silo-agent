key: box
title: Box
blurb: Your Box files and folders.
category: consumer
rclone_type: box
auth:
  kind: oauth2
  label: Box
  auth_url: https://account.box.com/api/oauth2/authorize
  token_url: https://api.box.com/oauth2/token
vars:
  - key: client_id
    kind: system
    type: text
    label: OAuth client ID
    required: true
  - key: client_secret
    kind: system
    type: secret
    label: OAuth client secret
    required: true
  - key: folder
    kind: user
    type: folder
    label: Folder to mount
    placeholder: Whole drive
    help: Only this folder shows up in the Bot. Leave empty to mount everything.
  - key: token
    kind: dynamic
    source: oauth
    secret: true
  - key: account
    kind: dynamic
    source: lookup
    lookup:
      url: https://api.box.com/2.0/users/me
      value: login
rclone:
  client_id: "{{system.client_id}}"
  client_secret: "{{system.client_secret}}"
  box_sub_type: user
  token: "{{dynamic.token}}"
mount:
  path: "{{user.folder}}"
