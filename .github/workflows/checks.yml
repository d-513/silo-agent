# Every push and pull request: the build, vet and the tests that need neither
# a database nor a container engine. The feature tests (internal/app and the
# other Postgres-backed packages) are run locally with `make test`.
# Actions are pinned by commit: move a pin on purpose.
name: Checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./cmd/... ./internal/...
      - name: Vet
        run: make vet
      - name: Formatting
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then echo "not gofmt-ed:"; echo "$out"; exit 1; fi
      - name: Unit tests
        run: make test-unit

  web:
    name: Web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.13
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm --dir web install --frozen-lockfile
      - name: Typecheck and unit tests
        run: make test-web
      - name: Production build
        run: pnpm --dir web exec vite build
      # The website shows the console itself over a scripted backend, so a
      # console change that breaks the demo fails here, not at the deploy.
      - name: Website (console demo, landing and docs)
        run: make site-build
