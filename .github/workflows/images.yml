# Builds and publishes the seven images (SiloOS's bootable one included) to ghcr.io/d-513, for amd64 and arm64:
#
#   push to master  ->  <image>:master-<sha>, and :master moved to it
#   tag vX.Y.Z      ->  <image>:vX.Y.Z, and :latest moved to it when the tag is
#                       a full release (no -rc suffix) and the highest so far;
#                       then a GitHub Release carrying SiloOS's installable
#                       media (ISO, qcow2 + Incus metadata, raw, vmdk, vhd,
#                       gce) for both architectures, with SHA256SUMS.
#
# A release is made as a draft, filled by one job per medium and published
# only once every medium is in it, so nobody downloads half a release. A
# failed medium is re-run with "Re-run failed jobs"; uploads replace.
#
# The control plane inside `silo` is always built to run the fixed tag of its
# own commit (master-<sha> or vX.Y.Z), never :master or :latest, so pulling
# either moving tag still gets a matched set (internal/version).
# Actions are pinned by commit: move a pin on purpose.
name: Images

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

# A newer commit on master replaces a build still running; a release never is.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/master' }}

env:
  REGISTRY: ghcr.io/d-513

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      moving: ${{ steps.plan.outputs.moving }}
      revision: ${{ steps.plan.outputs.revision }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      os_channel: ${{ steps.plan.outputs.os_channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag, to tell whether this release is the newest
      - id: plan
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          revision=${GITHUB_SHA::7}
          moving=""
          prerelease=false
          if [ "$REF_TYPE" = tag ]; then
            if ! echo "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::tag $REF_NAME is not vX.Y.Z or vX.Y.Z-suffix"
              exit 1
            fi
            version=$REF_NAME
            case "$version" in
              *-*) prerelease=true ;;
              *)
                # :latest follows the highest full release, so a patch to an
                # older line does not take it backwards.
                newest=$(git tag -l 'v*' | grep -Ev -- '-' | sort -V | tail -n1)
                if [ "$newest" = "$version" ]; then moving=latest; fi
                ;;
            esac
          else
            version=master-$revision
            moving=master
          fi
          # The channel SiloOS's media are built from, which is what an
          # installed machine then follows (bootc-image-builder has no other
          # way to say it): the newest full release follows :latest and keeps
          # updating; a prerelease or a patch to an older line stays on its
          # own version until an admin moves it.
          os_channel=$version
          if [ "$moving" = latest ]; then os_channel=latest; fi
          {
            echo "version=$version"
            echo "moving=$moving"
            echo "revision=$revision"
            echo "prerelease=$prerelease"
            echo "os_channel=$os_channel"
          } >> "$GITHUB_OUTPUT"
          echo "### $version${moving:+ (and :$moving)}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    needs: plan
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: [silo, silo-bot, silo-mcp-stdio, silo-drive, silo-egress, silo-caddy, silo-os]
        include:
          # The control plane is compiled inside its image (cgo, with the web
          # console); the others copy a static binary built here first.
          - { image: silo, file: images/cp/Containerfile, binary: "" }
          - { image: silo-bot, file: images/bot/Containerfile, binary: build-worker }
          - { image: silo-mcp-stdio, file: images/mcp-stdio/Containerfile, binary: build-bridge }
          - { image: silo-drive, file: images/drive/Containerfile, binary: build-drive }
          - { image: silo-egress, file: images/egress/Containerfile, binary: build-egress }
          # Caddy with Silo's DNS providers, compiled inside its image (SiloOS).
          - { image: silo-caddy, file: images/caddy/Containerfile, binary: "" }
          # SiloOS: a bootc image of this release's silo and silo-caddy (its
          # build args name them), with the host daemon built here. Its
          # ignore file (images/os/Containerfile.dockerignore) narrows the context.
          - { image: silo-os, file: images/os/Containerfile, binary: build-siloosd }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: matrix.binary != ''
        with:
          go-version-file: go.mod
      - name: Build the binary the image copies
        if: matrix.binary != ''
        run: >
          make ${{ matrix.binary }}
          CONTAINER_ARCH=${{ matrix.arch }}
          VERSION=${{ needs.plan.outputs.version }}
          REVISION=${{ needs.plan.outputs.revision }}
          REGISTRY=${{ env.REGISTRY }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed by digest only: the tags are put on once both architectures of
      # every image exist (the publish job).
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.plan.outputs.version }}
            REVISION=${{ needs.plan.outputs.revision }}
            REGISTRY=${{ env.REGISTRY }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
          provenance: false
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests/${{ matrix.image }}
          touch "digests/${{ matrix.image }}/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Tag
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The control plane last: once `silo` carries a tag, the images it will
      # ask for are already there.
      - name: Join the architectures under their tags
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          MOVING: ${{ needs.plan.outputs.moving }}
        run: |
          # SiloOS after the control plane: a machine following :master or
          # :latest pulls the silo and silo-caddy of the same tag.
          for image in silo-bot silo-mcp-stdio silo-drive silo-egress silo-caddy silo silo-os; do
            sources=""
            for digest in digests/"$image"/*; do
              sources="$sources $REGISTRY/$image@sha256:$(basename "$digest")"
            done
            tags="-t $REGISTRY/$image:$VERSION"
            if [ -n "$MOVING" ]; then tags="$tags -t $REGISTRY/$image:$MOVING"; fi
            # shellcheck disable=SC2086
            docker buildx imagetools create $tags $sources
            echo "- \`$REGISTRY/$image:$VERSION\`${MOVING:+ and \`:$MOVING\`}" >> "$GITHUB_STEP_SUMMARY"
          done

  release:
    name: GitHub Release (draft)
    if: github.ref_type == 'tag'
    needs: [plan, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          OS_CHANNEL: ${{ needs.plan.outputs.os_channel }}
        run: |
          # A re-run finds the release made the first time and only fills it.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION exists; the media jobs replace its files"
            exit 0
          fi
          flags="--draft --generate-notes --verify-tag"
          if [ "$PRERELEASE" = true ]; then flags="$flags --prerelease"; fi
          if [ "$OS_CHANNEL" = latest ]; then
            follows="follows \`latest\`, the stable releases, and updates itself (Admin → SiloOS → Updates)"
          else
            follows="stays on $VERSION until an admin moves it to a channel (Admin → SiloOS → Updates → Channel)"
          fi
          cat > notes.md <<EOF
          ## SiloOS

          A machine image that runs Silo and nothing else (images/os/README.md). A machine installed from these files $follows. Each file is for \`x86_64\` or \`aarch64\`:

          | File | For |
          | --- | --- |
          | \`silo-os-$VERSION-<arch>.iso\` | Bare metal. **Unattended: it erases the first disk it finds** |
          | \`silo-os-$VERSION-<arch>.qcow2\` | libvirt, Proxmox, QEMU, OpenStack, Hetzner… |
          | \`silo-os-$VERSION-<arch>.qcow2\` + \`-incus-metadata.tar.xz\` | Incus: \`incus image import silo-os-$VERSION-<arch>-incus-metadata.tar.xz silo-os-$VERSION-<arch>.qcow2 --alias silo-os\` |
          | \`silo-os-$VERSION-<arch>.raw.zst\` | A drive: \`zstd -dc … \| sudo dd of=/dev/sdX bs=4M\` |
          | \`silo-os-$VERSION-<arch>.vmdk\` | VMware |
          | \`silo-os-$VERSION-<arch>.vhd.zst\` | Azure (\`zstd -d\` first) |
          | \`silo-os-$VERSION-<arch>-gce.tar.gz\` | Google Cloud |

          A login comes from cloud-init user-data; the first admin of Silo is shown on the machine's console. \`SHA256SUMS\` has every file's checksum. A file split into \`.part00\`, \`.part01\`… (GitHub takes nothing of 2 GiB or more) is joined with \`cat file.part* > file\`; its checksum is of the joined file.

          Or switch an existing bootc machine: \`bootc switch $REGISTRY/silo-os:$OS_CHANNEL\`.

          ## The control plane on its own

          Run the control plane, which pulls the other images of this release itself:

              $REGISTRY/silo:$VERSION

          See docs/CONFIGURATION.md, "Running the control plane in a container".
          EOF
          # shellcheck disable=SC2086
          gh release create "$VERSION" $flags --notes-file notes.md

  media:
    name: SiloOS ${{ matrix.type }} (${{ matrix.arch }})
    if: github.ref_type == 'tag'
    needs: [plan, release]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        type: [iso, qcow2, raw, vmdk, vhd, gce]
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      OS_CHANNEL: ${{ needs.plan.outputs.os_channel }}
      TYPE: ${{ matrix.type }}
      ARCH: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # bootc-image-builder holds the image, its build tree and the disk at
      # once: more than a runner has free until its preinstalled toolchains go.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: Sign root's Podman in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | sudo podman login ghcr.io -u "$ACTOR" --password-stdin
      # The media follow :latest for the newest release: make sure it is this
      # release, not one tagged meanwhile.
      - name: Check the channel is this release
        if: needs.plan.outputs.os_channel != needs.plan.outputs.version
        run: |
          a=$(sudo skopeo inspect --raw "docker://$REGISTRY/silo-os:$OS_CHANNEL" | sha256sum)
          b=$(sudo skopeo inspect --raw "docker://$REGISTRY/silo-os:$VERSION" | sha256sum)
          if [ "$a" != "$b" ]; then
            echo "::error::$REGISTRY/silo-os:$OS_CHANNEL is not $VERSION any more; build the media of the newer release instead"
            exit 1
          fi
      - name: Build
        run: |
          if [ "$TYPE" = iso ]; then
            make os-iso OS_CHANNEL="$OS_CHANNEL"
          else
            make os-disk OS_CHANNEL="$OS_CHANNEL" OS_DISK_TYPE="$TYPE"
          fi
          if [ "$TYPE" = qcow2 ]; then make os-incus-meta OS_CHANNEL="$OS_CHANNEL"; fi
      - name: Package
        run: scripts/os-media.sh "$TYPE" "$ARCH" "$VERSION" build/os dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" dist/silo-os-* --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums-${{ matrix.type }}-${{ matrix.arch }}
          path: dist/sums
          if-no-files-found: error
          retention-days: 1

  finish:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [plan, media]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sums-*
          path: sums
          merge-multiple: true
      - name: Checksums, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          MOVING: ${{ needs.plan.outputs.moving }}
        run: |
          cat sums/*.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -ge 14 || { echo "::error::SHA256SUMS lists $(wc -l < SHA256SUMS) files, fewer than every medium makes"; exit 1; }
          gh release upload "$VERSION" SHA256SUMS --clobber
          latest=--latest=false
          if [ "$MOVING" = latest ]; then latest=--latest; fi
          gh release edit "$VERSION" --draft=false "$latest"
          gh release view "$VERSION" --json url,assets --jq '.url, (.assets[] | "\(.name)  \(.size)")' >> "$GITHUB_STEP_SUMMARY"
