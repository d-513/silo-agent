# SiloOS: use a datasource only when the platform is positively identified
# (a cloud's DMI, Incus's or Proxmox's cloud-init drive). A "maybe" (EC2 on
# any unknown VM) is not enough: cloud-init would otherwise wait minutes on
# a metadata service that is not there, holding up the boot. Nothing found
# turns cloud-init off.
policy: search,found=all,maybe=none,notfound=disabled
