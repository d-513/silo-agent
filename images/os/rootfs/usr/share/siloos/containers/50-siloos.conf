# SiloOS: published ports of rootless bridge networks are forwarded by pasta
# in the kernel, so a container sees who connected. Silo needs that for
# Caddy (sign-in throttling counts by address) and for mail (SPF, and the
# listener's limits). Podman's default, rootlessport, is a proxy in user
# space: every connection would seem to come from the container itself.
#
# Experimental in Podman 6. Installed to /etc/containers/containers.conf.d
# only when this image's Podman knows the option (images/os/Containerfile).
# It may be changed only while no container runs: reboot after touching it.
[network]
rootless_port_forwarder = "pasta"
